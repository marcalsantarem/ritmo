<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo MP3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ritmo MP3</title>
<style>
  html,body{height:100%}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#1d1d2e 0%,#0f0f17 70%);color:#eee;font-family:system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:8px;box-sizing:border-box;
    height:100dvh;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  #bar{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:480px}
  .btn{font-size:15px;font-weight:600;padding:11px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,#4caf7a,#389564);color:#fff;cursor:pointer;text-align:center;flex:1;
    box-shadow:0 2px 10px rgba(76,175,122,0.28);transition:transform .08s,opacity .15s}
  .btn:active:not(:disabled){transform:scale(0.97)}
  .btn.alt{background:#2a2a3d;box-shadow:0 2px 8px rgba(0,0,0,0.25);border:1px solid #3a3a52}
  .btn:disabled{background:#262633;color:#666;box-shadow:none;cursor:default}
  #diff{display:flex;gap:4px;width:100%;max-width:480px;background:#1a1a26;padding:4px;border-radius:10px;border:1px solid #2b2b3d;box-sizing:border-box}
  .dbtn{flex:1;border:0;border-radius:7px;padding:7px 8px;font-size:13px;font-weight:600;background:transparent;color:#9a9ab0;cursor:pointer;transition:background .15s,color .15s}
  .dbtn.active{background:#34344d;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.3)}
  #sync{display:flex;align-items:center;gap:8px;width:100%;max-width:480px;background:#1a1a26;padding:5px 10px;border-radius:10px;border:1px solid #2b2b3d;box-sizing:border-box;font-size:12px;color:#9a9ab0}
  #sync input[type=range]{flex:1;accent-color:#4caf7a;margin:0;height:18px;cursor:pointer}
  #latVal{min-width:52px;text-align:right;color:#eee;font-variant-numeric:tabular-nums;font-weight:600}
  #file{display:none}
  #status{margin:0;color:#a8a8be;font-size:13px;text-align:center;min-height:18px;max-width:480px}
  canvas{background:#141420;border-radius:12px;border:1px solid #29293b;box-shadow:0 8px 28px rgba(0,0,0,0.45);
    width:100%;max-width:480px;flex:1;min-height:0;touch-action:none;display:block}
</style>
</head>
<body>
<div id="bar">
  <label class="btn alt" for="file">Escolher música</label>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg">
  <button class="btn" id="play" disabled>Jogar</button>
  <button class="btn alt" id="pause" disabled>Pausar</button>
</div>
<div id="diff" role="group" aria-label="Dificuldade">
  <button class="dbtn" data-diff="easy">Fácil</button>
  <button class="dbtn" data-diff="medium">Médio</button>
  <button class="dbtn active" data-diff="hard">Difícil</button>
</div>
<div id="sync">
  <span>Atraso:</span>
  <input type="range" id="lat" min="-200" max="200" step="10" value="0" aria-label="Ajuste de latência em milissegundos">
  <span id="latVal">0 ms</span>
</div>
<p id="status">Escolha uma música. Toque nas pistas quando as notas chegarem à linha.</p>
<canvas id="c"></canvas>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
let W = 400, H = 560, LW = 100, HIT_Y = 470, RAD = 22;
const DIFFS = {
  easy:   { label: 'Fácil',   fall: 2.1, window: 0.24, mult: 1.65, bias: 0.080, subdiv: 1, snap: 0.35, beatTol: 0.24, minGapFactor: 0.85, minGapFloor: 0.42 },
  medium: { label: 'Médio',   fall: 1.8, window: 0.21, mult: 1.38, bias: 0.055, subdiv: 2, snap: 0.25, beatTol: 0.28, minGapFactor: 0.45, minGapFloor: 0.26 },
  hard:   { label: 'Difícil', fall: 1.5, window: 0.18, mult: 1.18, bias: 0.035, subdiv: 4, snap: 0.15, beatTol: 0.34, minGapFactor: 0.22, minGapFloor: 0.15 }
};
let diffKey = 'hard';
let latencyMs = Number(localStorage.getItem('ritmo_lat_ms') || 0);
if (Number.isNaN(latencyMs)) latencyMs = 0;
let detectedBpm = 0;
const COLORS = ['#4caf7a', '#e05a5a', '#e6c84a', '#4a90e2'], KEYS = ['d', 'f', 'j', 'k'];
let ctx, buffer, source, notes = [], startAt = 0, playing = false, paused = false, wake = null;
let score = 0, combo = 0, hits = 0, lastFrame = performance.now();
const flash = [0, 0, 0, 0], receptorPop = [0, 0, 0, 0], stringVib = [0, 0, 0];
const particles = [], rings = [], popups = [], comboBanners = [];
const BG_SYMBOLS = ['♪', '♫', '♩', '♬', '𝄞'];
const bgNotes = Array.from({ length: 18 }, (_, i) => ({
  x: (i * 0.6180339) % 1,
  y: Math.random(),
  speed: 0.015 + Math.random() * 0.025,
  size: 16 + Math.random() * 20,
  sym: BG_SYMBOLS[i % BG_SYMBOLS.length],
  alpha: 0.04 + Math.random() * 0.055,
  sway: Math.random() * Math.PI * 2,
  rot: (Math.random() - 0.5) * 0.35
}));
const COMBO_MILESTONES = {
  10:  { sub: 'NO RITMO!',   color: '#4caf7a', glow: 'rgba(76, 175, 122, 0.45)' },
  25:  { sub: 'AQUECENDO!',  color: '#e6c84a', glow: 'rgba(230, 200, 74, 0.50)' },
  50:  { sub: 'EM CHAMAS!',  color: '#ff7b54', glow: 'rgba(255, 123, 84, 0.55)' },
  100: { sub: 'LENDÁRIO!',   color: '#c77dff', glow: 'rgba(199, 125, 255, 0.65)' }
};

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width || !r.height) return;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = r.width; H = r.height; LW = W / 4; HIT_Y = H - 90; RAD = Math.min(34, LW * 0.36);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// Gera as notas: mistura estéreo, separa em 3 bandas (grave/médio/agudo), estima o BPM e alinha ao pulso
function makeNotes(buf, key = diffKey) {
  const cfg = DIFFS[key];
  const ch0 = buf.getChannelData(0);
  const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
  const sr = buf.sampleRate, hop = 512, n = Math.floor(ch0.length / hop);
  const fps = sr / hop;

  // Filtros passa-baixa em cascata para separar graves (<160 Hz), médios (160–2200 Hz) e agudos (>2200 Hz)
  const a1 = 1 - Math.exp(-2 * Math.PI * 160 / sr);
  const a2 = 1 - Math.exp(-2 * Math.PI * 2200 / sr);
  let lp1a = 0, lp1b = 0, lp2a = 0, lp2b = 0;

  const eL = new Float32Array(n), eM = new Float32Array(n), eH = new Float32Array(n);
  const rmsAll = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let sL = 0, sM = 0, sH = 0, sAll = 0;
    for (let j = i * hop, end = j + hop; j < end; j++) {
      const x = ch1 ? 0.5 * (ch0[j] + ch1[j]) : ch0[j];
      lp1a += a1 * (x - lp1a); lp1b += a1 * (lp1a - lp1b);
      lp2a += a2 * (x - lp2a); lp2b += a2 * (lp2a - lp2b);
      const low = lp1b;
      const mid = lp2b - lp1b;
      const high = x - lp2b;
      sL += low * low;
      sM += mid * mid;
      sH += high * high;
      sAll += x * x;
    }
    eL[i] = Math.log1p(100 * Math.sqrt(sL / hop));
    eM[i] = Math.log1p(100 * Math.sqrt(sM / hop));
    eH[i] = Math.log1p(100 * Math.sqrt(sH / hop));
    rmsAll[i] = Math.sqrt(sAll / hop);
  }

  // Fluxo espectral positivo por banda e curva combinada de onsets
  const fL = new Float32Array(n), fM = new Float32Array(n), fH = new Float32Array(n), odf = new Float32Array(n);
  for (let i = 1; i < n; i++) {
    fL[i] = Math.max(0, eL[i] - eL[i - 1]);
    fM[i] = Math.max(0, eM[i] - eM[i - 1]);
    fH[i] = Math.max(0, eH[i] - eH[i - 1]);
    odf[i] = 1.25 * fL[i] + 1.0 * fM[i] + 0.75 * fH[i];
  }

  // Estimativa de BPM por autocorrelação (70–175 BPM)
  const lagMin = Math.max(4, Math.floor(fps * 60 / 175));
  const lagMax = Math.min(Math.floor(n / 3), Math.ceil(fps * 60 / 70));
  const winStart = Math.floor(n * 0.1);
  const winEnd = Math.min(n - lagMax - 1, winStart + Math.floor(fps * 60));
  let bestLag = Math.round(fps * 0.5), bestCorr = -1;
  for (let lag = lagMin; lag <= lagMax; lag++) {
    let sum = 0;
    for (let i = winStart; i < winEnd; i += 2) sum += odf[i] * odf[i + lag];
    const bpm = 60 * fps / lag;
    const prior = 1 - 0.15 * Math.abs(bpm - 120) / 60;
    const score = sum * prior;
    if (score > bestCorr) { bestCorr = score; bestLag = lag; }
  }
  const beatSec = bestLag / fps;
  detectedBpm = Math.round(60 / beatSec);

  // Fase inicial da batida
  let bestPhase = 0, bestPhaseScore = -1;
  for (let p = 0; p < bestLag; p++) {
    let sum = 0;
    for (let i = p; i < n; i += bestLag) sum += odf[i];
    if (sum > bestPhaseScore) { bestPhaseScore = sum; bestPhase = p; }
  }
  const phaseSec = bestPhase / fps;

  // Limiar adaptativo por mediana móvel
  const R = 14, winArr = new Float32Array(2 * R + 1);
  const candidates = [];
  for (let i = 1; i < n - 1; i++) {
    if (rmsAll[i] < 0.012) continue;
    if (odf[i] < odf[i - 1] || odf[i] < odf[i + 1]) continue;
    let k = 0;
    for (let j = Math.max(0, i - R); j <= Math.min(n - 1, i + R); j++) winArr[k++] = odf[j];
    const slice = winArr.subarray(0, k).sort();
    const med = slice[k >> 1];
    const thresh = cfg.mult * med + cfg.bias;
    if (odf[i] <= thresh) continue;

    const rawT = i / fps;
    const step = beatSec / cfg.subdiv;
    const gridIdx = Math.round((rawT - phaseSec) / step);
    const gridT = phaseSec + gridIdx * step;
    const distNorm = Math.abs(rawT - gridT) / step;
    const isStrongSyncopation = odf[i] > thresh * 1.65;
    if (distNorm > cfg.beatTol && !isStrongSyncopation) continue;

    const t = distNorm <= cfg.beatTol ? rawT * (1 - cfg.snap) + gridT * cfg.snap : rawT;
    if (t < 0.15) continue;
    const bright = (0.0 * fL[i] + 1.5 * fM[i] + 3.0 * fH[i]) / (fL[i] + fM[i] + fH[i] + 1e-6);
    candidates.push({ t, str: odf[i], bright, hit: false, missed: false });
  }

  // Filtragem por intervalo mínimo proporcional ao BPM (mantendo o pico mais forte)
  const minGap = Math.max(cfg.minGapFloor, beatSec * cfg.minGapFactor);
  const out = [];
  for (const c of candidates) {
    const prev = out[out.length - 1];
    if (!prev || c.t - prev.t >= minGap) {
      out.push(c);
    } else if (c.str > prev.str * 1.15) {
      out[out.length - 1] = c;
    }
  }

  // Mapeamento de pistas por brilho adaptativo + suavização de fluxo
  const sorted = out.map(o => o.bright).sort((a, b) => a - b);
  const q = p => sorted[Math.floor(sorted.length * p)] ?? 0;
  const q1 = q(0.25), q2 = q(0.5), q3 = q(0.75);
  let repeatCount = 0;
  for (let i = 0; i < out.length; i++) {
    const o = out[i];
    let lane = o.bright < q1 ? 0 : o.bright < q2 ? 1 : o.bright < q3 ? 2 : 3;
    if (i > 0) {
      const prev = out[i - 1];
      const dt = o.t - prev.t;
      if (dt < 0.26 && Math.abs(lane - prev.lane) === 3 && Math.abs(o.bright - prev.bright) < 1.2) {
        lane = lane > prev.lane ? 2 : 1;
      }
      if (lane === prev.lane && dt < 0.32) {
        repeatCount++;
        if (repeatCount >= 2) {
          lane = lane === 3 ? 2 : lane + 1;
          repeatCount = 0;
        }
      } else {
        repeatCount = 0;
      }
    }
    o.lane = lane;
  }
  return out;
}

function decode(ab) {
  // Forma com callbacks: funciona também em versões antigas do Safari
  return new Promise((ok, fail) => {
    const p = ctx.decodeAudioData(ab, ok, fail);
    if (p && p.catch) p.catch(fail);
  });
}

function ensureCtx() {
  // No iPhone, faz o som sair mesmo com a chave lateral no silencioso (iOS 17+)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
}

function formatLat(ms) {
  return (ms > 0 ? '+' : '') + ms + ' ms';
}
$('lat').value = latencyMs;
$('latVal').textContent = formatLat(latencyMs);
$('lat').oninput = ev => {
  latencyMs = Number(ev.target.value);
  $('latVal').textContent = formatLat(latencyMs);
  localStorage.setItem('ritmo_lat_ms', String(latencyMs));
};

document.querySelectorAll('.dbtn').forEach(btn => {
  btn.onclick = () => {
    const next = btn.dataset.diff;
    if (next === diffKey) return;
    diffKey = next;
    document.querySelectorAll('.dbtn').forEach(b => b.classList.toggle('active', b === btn));
    if (buffer) {
      stop();
      notes = makeNotes(buffer, diffKey);
      const bpmTxt = detectedBpm ? ` · ${detectedBpm} BPM` : '';
      $('status').textContent = `${DIFFS[diffKey].label}${bpmTxt}: ${notes.length} notas geradas. Toque em Jogar.`;
    }
  };
});

$('file').onchange = async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  stop();
  $('play').disabled = true;
  $('status').textContent = 'Analisando a música...';
  try {
    ensureCtx();
    buffer = await decode(await file.arrayBuffer());
    notes = makeNotes(buffer, diffKey);
    const bpmTxt = detectedBpm ? ` · ${detectedBpm} BPM` : '';
    $('status').textContent = `${DIFFS[diffKey].label}${bpmTxt}: ${notes.length} notas geradas. Toque em Jogar.`;
    $('play').disabled = false;
  } catch (err) {
    $('status').textContent = 'Não consegui ler esse arquivo. Tente outro MP3.';
  }
};

function stop() {
  if (source) { source.onended = null; try { source.stop(); } catch (e) {} source = null; }
  playing = false;
  paused = false;
  $('pause').disabled = true;
  $('pause').textContent = 'Pausar';
  $('play').textContent = 'Jogar';
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
}

function togglePause() {
  if (!playing || !ctx) return;
  const cfg = DIFFS[diffKey];
  if (!paused) {
    paused = true;
    ctx.suspend().catch(() => {});
    $('pause').textContent = 'Continuar';
    $('status').textContent = `Pausado (${cfg.label})`;
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  } else {
    ctx.resume().catch(() => {}).then(() => {
      paused = false;
      $('pause').textContent = 'Pausar';
      $('status').textContent = `Tocando (${cfg.label})...`;
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
    });
  }
}

$('pause').onclick = togglePause;

$('play').onclick = () => {
  if (!buffer) return;
  stop();
  ensureCtx();
  // resume() precisa ser chamado dentro do toque para o iOS liberar o áudio
  const ready = ctx.state === 'running' ? Promise.resolve() : ctx.resume();
  Promise.resolve(ready).catch(() => {}).then(() => {
    const cfg = DIFFS[diffKey];
    notes.forEach(o => { o.hit = o.missed = false; });
    score = combo = hits = 0;
    particles.length = rings.length = popups.length = comboBanners.length = 0;
    stringVib.fill(0);
    source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    startAt = ctx.currentTime + cfg.fall;
    source.start(startAt);
    source.onended = () => {
      playing = false;
      paused = false;
      $('pause').disabled = true;
      $('pause').textContent = 'Pausar';
      $('play').textContent = 'Jogar';
      if (wake) { try { wake.release(); } catch (e) {} wake = null; }
      $('status').textContent = 'Fim! Pontos: ' + score + ' · Acertos: ' + hits + '/' + notes.length;
    };
    playing = true;
    paused = false;
    $('pause').disabled = false;
    $('pause').textContent = 'Pausar';
    $('play').textContent = 'Reiniciar';
    $('status').textContent = `Tocando (${cfg.label})...`;
    // Mantém a tela ligada durante a música
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
  });
};

function spawnHitEffect(lane, label, pts) {
  const x = lane * LW + LW / 2, y = HIT_Y, color = COLORS[lane];
  receptorPop[lane] = 1;
  if (lane > 0) stringVib[lane - 1] = 1;
  if (lane < 3) stringVib[lane] = 1;
  rings.push({ x, y, r: RAD * 0.9, maxR: RAD * 2.4, color, life: 1 });
  rings.push({ x, y, r: RAD * 0.5, maxR: RAD * 1.7, color: '#ffffff', life: 0.85 });
  for (let i = 0; i < 14; i++) {
    const ang = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.35;
    const spd = 90 + Math.random() * 170;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 45,
      size: 2.5 + Math.random() * 3.5,
      color: i % 4 === 0 ? '#ffffff' : color,
      life: 1
    });
  }
  popups.push({ x, y: y - RAD - 10, text: `${label} +${pts}`, color, life: 1 });
}

function triggerComboBanner(count) {
  const m = COMBO_MILESTONES[count];
  if (!m) return;
  comboBanners.push({
    title: `${count} NOTAS!`,
    sub: m.sub,
    color: m.color,
    glow: m.glow,
    life: 1,
    duration: count >= 50 ? 2.1 : 1.7
  });
}

function press(lane) {
  if (paused) return;
  flash[lane] = 1;
  if (!playing) return;
  const win = DIFFS[diffKey].window;
  const now = ctx.currentTime - startAt - latencyMs / 1000;
  let best = null;
  for (const o of notes) {
    if (o.t > now + win) break;
    if (o.lane === lane && !o.hit && !o.missed && Math.abs(o.t - now) <= win &&
        (!best || Math.abs(o.t - now) < Math.abs(best.t - now))) best = o;
  }
  if (best) {
    best.hit = true;
    combo++;
    hits++;
    const mult = Math.min(4, 1 + Math.floor(combo / 10));
    const pts = 10 * mult;
    score += pts;
    const err = Math.abs(best.t - now);
    const label = err <= win * 0.35 ? 'PERFEITO!' : err <= win * 0.7 ? 'ÓTIMO!' : 'BOM!';
    spawnHitEffect(lane, label, pts);
    triggerComboBanner(combo);
    if (navigator.vibrate) navigator.vibrate(10);
  } else {
    combo = 0;
  }
}

addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if ((k === 'p' || ev.key === 'Escape') && !ev.repeat) { togglePause(); return; }
  const i = KEYS.indexOf(k);
  if (i >= 0 && !ev.repeat) press(i);
});
// Cada dedo gera seu próprio pointerdown, então vários toques ao mesmo tempo funcionam
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  press(Math.max(0, Math.min(3, Math.floor((ev.clientX - r.left) / r.width * 4))));
});
cv.addEventListener('touchstart', ev => ev.preventDefault(), { passive: false });
document.addEventListener('gesturestart', ev => ev.preventDefault());

function drawNote(x, y, color, alpha) {
  const r = RAD * 0.82;
  g.save();
  g.globalAlpha = alpha * 0.28;
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r * 1.36, 0, Math.PI * 2); g.fill();

  g.globalAlpha = alpha;
  const grad = g.createRadialGradient(x - r * 0.28, y - r * 0.28, r * 0.08, x, y, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.28, color);
  grad.addColorStop(0.88, '#141422');
  grad.addColorStop(1, '#090910');
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();

  // Aro externo e brilho especular
  g.strokeStyle = 'rgba(255,255,255,0.68)';
  g.lineWidth = 1.6;
  g.beginPath(); g.arc(x, y, r - 1, 0, Math.PI * 2); g.stroke();

  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.beginPath();
  g.ellipse(x - r * 0.28, y - r * 0.32, r * 0.24, r * 0.12, -0.6, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function drawBackground(dt, ts) {
  // Paleta escura para manter máximo contraste com as notas
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0b13');
  bg.addColorStop(0.5, '#111220');
  bg.addColorStop(1, '#0c0d17');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  // Vinheta / brilho sutil no centro
  const rg = g.createRadialGradient(W / 2, H * 0.45, 20, W / 2, H * 0.45, Math.max(W, H) * 0.72);
  rg.addColorStop(0, 'rgba(64, 72, 130, 0.10)');
  rg.addColorStop(1, 'rgba(5, 5, 10, 0.35)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);

  // Trastes sutis do braço (frets) para compor com as cordas
  const fretGap = 76;
  for (let y = fretGap; y < HIT_Y - 24; y += fretGap) {
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fillRect(0, y + 1, W, 1.5);
    g.fillStyle = 'rgba(180,190,230,0.04)';
    g.fillRect(0, y, W, 1);
  }

  // Pauta musical discreta no fundo
  g.strokeStyle = 'rgba(130, 145, 210, 0.045)';
  g.lineWidth = 1;
  const staffTop = H * 0.22;
  for (let s = 0; s < 5; s++) {
    const sy = staffTop + s * 11;
    g.beginPath();
    g.moveTo(0, sy);
    g.lineTo(W, sy);
    g.stroke();
  }

  // Notas musicais flutuantes em tons escuros/suaves
  g.save();
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (const n of bgNotes) {
    n.y -= n.speed * dt;
    if (n.y < -0.08) { n.y = 1.08; n.x = (n.x + 0.37) % 1; }
    const px = n.x * W + Math.sin(ts * 0.0008 + n.sway) * 10;
    const py = n.y * H;
    g.save();
    g.translate(px, py);
    g.rotate(n.rot + Math.sin(ts * 0.0006 + n.sway) * 0.08);
    g.globalAlpha = n.alpha;
    g.fillStyle = '#7e88c4';
    g.font = `${n.size}px Georgia, serif`;
    g.fillText(n.sym, 0, 0);
    g.restore();
  }
  g.restore();
}

function drawGuitarString(idx, x, vib, ts) {
  const gauge = [3.2, 2.7, 2.2][idx];
  const trace = offset => {
    g.beginPath();
    if (vib > 0.01) {
      const steps = 22;
      const amp = vib * 2.4;
      for (let s = 0; s <= steps; s++) {
        const y = (s / steps) * H;
        const env = Math.sin((s / steps) * Math.PI);
        const dx = Math.sin(y * 0.08 + ts * 0.06 + idx) * amp * env;
        if (s === 0) g.moveTo(x + offset + dx, y);
        else g.lineTo(x + offset + dx, y);
      }
    } else {
      g.moveTo(x + offset, 0);
      g.lineTo(x + offset, H);
    }
  };

  g.save();
  g.lineCap = 'butt';

  // Sombra / canal escuro atrás da corda
  g.strokeStyle = 'rgba(0,0,0,0.7)';
  g.lineWidth = gauge + 3;
  trace(1.2);
  g.stroke();

  // Brilho sutil quando a corda vibra
  if (vib > 0.05) {
    g.strokeStyle = `rgba(230, 210, 165, ${vib * 0.25})`;
    g.lineWidth = gauge + 5;
    trace(0);
    g.stroke();
  }

  // Núcleo metálico da corda (bronze/aço)
  g.strokeStyle = idx === 0 ? '#7d6e5d' : idx === 1 ? '#877c6f' : '#8d929c';
  g.lineWidth = gauge;
  trace(0);
  g.stroke();

  // Textura de enrolamento (corda encapada)
  g.setLineDash([1.5, 2.5]);
  g.strokeStyle = 'rgba(20, 18, 16, 0.55)';
  g.lineWidth = gauge * 0.95;
  trace(0);
  g.stroke();

  g.lineDashOffset = 1.5;
  g.strokeStyle = 'rgba(235, 228, 215, 0.32)';
  g.lineWidth = gauge * 0.7;
  trace(-0.3);
  g.stroke();
  g.setLineDash([]);

  // Filete especular metálico
  g.strokeStyle = 'rgba(255, 255, 255, 0.42)';
  g.lineWidth = 0.75;
  trace(-gauge * 0.24);
  g.stroke();

  g.restore();
}

function draw(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastFrame) / 1000));
  lastFrame = ts;
  const cfg = DIFFS[diffKey];

  drawBackground(dt, ts);

  // Linha horizontal de acerto (ponte/rastilho)
  g.save();
  g.fillStyle = 'rgba(0,0,0,0.45)';
  g.fillRect(0, HIT_Y + 1, W, 3);
  const hitLineGrad = g.createLinearGradient(0, 0, W, 0);
  hitLineGrad.addColorStop(0, 'rgba(255,255,255,0.06)');
  hitLineGrad.addColorStop(0.5, 'rgba(255,255,255,0.22)');
  hitLineGrad.addColorStop(1, 'rgba(255,255,255,0.06)');
  g.strokeStyle = hitLineGrad;
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, HIT_Y); g.lineTo(W, HIT_Y); g.stroke();
  g.restore();

  // Pistas e flashes
  for (let i = 0; i < 4; i++) {
    if (flash[i] > 0) {
      const fg = g.createLinearGradient(0, HIT_Y - 190, 0, H);
      fg.addColorStop(0, 'rgba(0,0,0,0)');
      fg.addColorStop(0.75, COLORS[i]);
      fg.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = flash[i] * 0.28;
      g.fillStyle = fg;
      g.fillRect(i * LW, 0, LW, H);
      g.globalAlpha = 1;
      flash[i] = Math.max(0, flash[i] - dt * 5);
    }
  }

  // Paredes entre as notas como cordas de guitarra
  for (let i = 0; i < 3; i++) {
    if (stringVib[i] > 0) stringVib[i] = Math.max(0, stringVib[i] - dt * 3.4);
    drawGuitarString(i, (i + 1) * LW, stringVib[i], ts);
  }

  // Receptores
  for (let i = 0; i < 4; i++) {
    const cx = i * LW + LW / 2;
    const pop = receptorPop[i];
    if (pop > 0) receptorPop[i] = Math.max(0, pop - dt * 6);
    const rr = RAD * (1 + pop * 0.16);

    g.globalAlpha = 0.16 + pop * 0.30;
    g.fillStyle = COLORS[i];
    g.beginPath(); g.arc(cx, HIT_Y, rr * 1.32, 0, Math.PI * 2); g.fill();

    g.globalAlpha = 1;
    g.fillStyle = 'rgba(12,12,20,0.88)';
    g.beginPath(); g.arc(cx, HIT_Y, rr, 0, Math.PI * 2); g.fill();
    g.strokeStyle = COLORS[i];
    g.lineWidth = 3.5 + pop * 2;
    g.beginPath(); g.arc(cx, HIT_Y, rr, 0, Math.PI * 2); g.stroke();

    g.strokeStyle = 'rgba(255,255,255,0.22)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(cx, HIT_Y, rr * 0.74, 0, Math.PI * 2); g.stroke();

    g.fillStyle = 'rgba(255,255,255,0.42)';
    g.font = 'bold 12px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(KEYS[i].toUpperCase(), cx, HIT_Y);
  }
  g.textBaseline = 'alphabetic';

  // Notas caindo e barra de progresso
  if (playing) {
    const now = ctx.currentTime - startAt - latencyMs / 1000;
    if (buffer && buffer.duration > 0) {
      const prog = Math.max(0, Math.min(1, now / buffer.duration));
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.fillRect(0, 0, W, 4);
      g.fillStyle = '#4caf7a';
      g.fillRect(0, 0, W * prog, 4);
    }
    for (const o of notes) {
      if (o.t > now + cfg.fall) break;
      if (o.hit) continue;
      if (!o.missed && now - o.t > cfg.window) { o.missed = true; combo = 0; }
      const y = HIT_Y - (o.t - now) / cfg.fall * HIT_Y;
      if (y > H + RAD) continue;
      drawNote(o.lane * LW + LW / 2, y, COLORS[o.lane], o.missed ? 0.25 : 1);
    }
  }

  // Ondas de choque ao acertar
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt * 3.2;
    if (r.life <= 0) { rings.splice(i, 1); continue; }
    const t = 1 - r.life;
    const rad = r.r + (r.maxR - r.r) * t;
    g.globalAlpha = r.life * 0.85;
    g.strokeStyle = r.color;
    g.lineWidth = 3.5 * r.life + 1;
    g.beginPath(); g.arc(r.x, r.y, rad, 0, Math.PI * 2); g.stroke();
  }

  // Partículas de acerto
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * 2.2;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 260 * dt;
    p.vx *= 0.96;
    g.globalAlpha = p.life;
    g.fillStyle = p.color;
    g.beginPath(); g.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); g.fill();
  }

  // Texto flutuante de feedback
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt * 1.8;
    if (p.life <= 0) { popups.splice(i, 1); continue; }
    p.y -= 36 * dt;
    g.globalAlpha = Math.min(1, p.life * 1.6);
    g.font = 'bold 14px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center';
    g.fillStyle = '#000';
    g.fillText(p.text, p.x + 1, p.y + 1);
    g.fillStyle = p.color;
    g.fillText(p.text, p.x, p.y);
  }
  // Avisos de marco de combo (10, 25, 50, 100)
  for (let i = comboBanners.length - 1; i >= 0; i--) {
    const b = comboBanners[i];
    b.life -= dt / b.duration;
    if (b.life <= 0) { comboBanners.splice(i, 1); continue; }
    const elapsed = 1 - b.life;
    const scale = elapsed < 0.14
      ? 0.65 + (elapsed / 0.14) * 0.43
      : elapsed < 0.25
        ? 1.08 - ((elapsed - 0.14) / 0.11) * 0.08
        : 1;
    const alpha = b.life < 0.25 ? b.life / 0.25 : Math.min(1, elapsed / 0.08);
    const by = H * 0.28 - elapsed * 18;

    g.save();
    g.translate(W / 2, by);
    g.scale(scale, scale);
    g.globalAlpha = alpha;

    // Brilho atrás do aviso
    const glow = g.createRadialGradient(0, 0, 8, 0, 0, 110);
    glow.addColorStop(0, b.glow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(0, 0, 110, 0, Math.PI * 2); g.fill();

    // Cartão escuro translúcido
    const bw = Math.min(W - 36, 224), bh = 58, br = 14;
    g.fillStyle = 'rgba(12, 13, 24, 0.88)';
    g.beginPath();
    if (g.roundRect) g.roundRect(-bw / 2, -bh / 2, bw, bh, br);
    else g.rect(-bw / 2, -bh / 2, bw, bh);
    g.fill();
    g.strokeStyle = b.color;
    g.lineWidth = 2;
    g.stroke();

    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = b.color;
    g.font = '900 22px system-ui, -apple-system, sans-serif';
    g.fillText(b.title, 0, -9);

    g.fillStyle = '#e8eaf6';
    g.font = '700 12px system-ui, -apple-system, sans-serif';
    g.fillText(`♪ ${b.sub} ♪`, 0, 14);
    g.restore();
  }
  g.globalAlpha = 1;

  // HUD
  const mult = Math.min(4, 1 + Math.floor(combo / 10));
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.75)';
  g.shadowBlur = 4;
  g.fillStyle = '#eee';
  g.font = 'bold 16px system-ui, -apple-system, sans-serif';
  g.textAlign = 'left';
  g.fillText('Pontos: ' + score, 12, 26);
  g.textAlign = 'right';
  g.fillStyle = mult > 1 ? '#e6c84a' : '#eee';
  g.fillText(`Combo: ${combo} (x${mult})`, W - 12, 26);
  g.restore();

  if (paused) {
    g.fillStyle = 'rgba(10,10,18,0.68)';
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#fff';
    g.font = 'bold 28px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center';
    g.fillText('PAUSADO', W / 2, H / 2 - 6);
    g.fillStyle = '#b4b4cc';
    g.font = '14px system-ui, -apple-system, sans-serif';
    g.fillText('Toque em Continuar para voltar', W / 2, H / 2 + 22);
  }

  requestAnimationFrame(draw);
}
resize();
requestAnimationFrame(draw);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
