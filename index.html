<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo MP3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ritmo MP3</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#090a14;color:#eee;font-family:system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;height:100dvh;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden}
  .screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 12px 14px;gap:10px;overflow:hidden}
  .hidden{display:none !important}

  /* Fundo compartilhado com partitura */
  .bg-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.38;pointer-events:none;z-index:0}
  .bg-scrim{position:absolute;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,rgba(8,9,18,0.82) 0%,rgba(11,13,26,0.68) 48%,rgba(7,8,15,0.94) 100%)}
  .z1{position:relative;z-index:1}

  /* Topo / Logo do Menu */
  .menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:2px}
  .brand{display:flex;align-items:center;gap:10px}
  .eq-icon{width:38px;height:38px;border-radius:12px;background:#16192b;border:1px solid rgba(255,255,255,0.16);
    display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:8px;
    box-shadow:0 0 16px rgba(76,175,122,0.28)}
  .eq-icon span{width:4px;border-radius:99px;display:block}
  @keyframes eq1{0%,100%{height:6px}50%{height:18px}}
  @keyframes eq2{0%,100%{height:16px}50%{height:7px}}
  @keyframes eq3{0%,100%{height:8px}50%{height:20px}}
  .eq-1{background:#4caf7a;animation:eq1 .75s ease-in-out infinite}
  .eq-2{background:#e05a5a;animation:eq2 .58s ease-in-out infinite}
  .eq-3{background:#e6c84a;animation:eq3 .82s ease-in-out infinite}
  .eq-4{background:#4a90e2;animation:eq2 .64s ease-in-out infinite}
  .brand-title{display:flex;align-items:center;gap:6px;line-height:1}
  .brand-title strong{font-size:21px;font-weight:900;letter-spacing:0.06em;color:#fff}
  .brand-badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;color:#081018;
    background:linear-gradient(135deg,#4caf7a,#4a90e2)}
  .lane-dots{display:flex;gap:4px;margin-top:5px}
  .lane-dots i{display:block;height:3px;width:14px;border-radius:99px}

  .import-btn{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.16);
    color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,transform .08s}
  .import-btn:active{transform:scale(0.97)}
  #file{display:none}

  /* Setlist */
  .setlist-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:0 2px}
  .setlist-label{font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#9aa3c8}
  .setlist-meta{font-family:ui-monospace,SFMono-Regular,monospace;font-weight:700;color:#e6c84a}

  #songList{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  #songList::-webkit-scrollbar{width:4px}
  #songList::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.16);border-radius:99px}

  .song-card{width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.10);
    background:rgba(16,18,32,0.82);color:#d7daf0;cursor:pointer;display:flex;align-items:center;gap:12px;
    transition:border-color .15s,background .15s,transform .08s,box-shadow .15s}
  .song-card:active{transform:scale(0.99)}
  .song-card.active{background:rgba(23,36,46,0.92);border-color:#4caf7a;color:#fff;
    box-shadow:0 0 18px rgba(76,175,122,0.22)}
  .song-disc{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-weight:900;font-size:14px;color:#fff;border:1px solid rgba(255,255,255,0.16)}
  .song-info{flex:1;min-width:0}
  .song-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song-sub{font-size:12px;color:#929abc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .song-right{text-align:right;flex-shrink:0;min-width:74px}
  .song-bpm{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;font-weight:800;color:#9aa3c8}
  .song-bpm.has-best{color:#ffe270}
  .song-card.active .song-bpm{color:#4caf7a}
  .song-card.active .song-bpm.has-best{color:#ffe270}
  .song-bpm-lbl{font-size:10px;color:#6e7698;text-transform:uppercase;letter-spacing:0.05em;margin-top:2px}
  .song-bpm-lbl.has-best{color:#aeb6d6;font-weight:700}

  /* Dificuldades temáticas */
  #diffGroup{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .dbtn{padding:10px 8px;border-radius:12px;border:1px solid rgba(255,255,255,0.10);background:rgba(14,16,29,0.80);
    color:#949bb8;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s}
  .dbtn:active{transform:scale(0.97)}
  .dbtn.active[data-diff="easy"]{background:rgba(76,175,122,0.18);border-color:#4caf7a;color:#fff;box-shadow:0 0 14px rgba(76,175,122,0.22)}
  .dbtn.active[data-diff="medium"]{background:rgba(230,200,74,0.18);border-color:#e6c84a;color:#fff;box-shadow:0 0 14px rgba(230,200,74,0.20)}
  .dbtn.active[data-diff="hard"]{background:rgba(224,90,90,0.20);border-color:#e05a5a;color:#fff;box-shadow:0 0 14px rgba(224,90,90,0.22)}

  /* Sincronia Stepper */
  .sync-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(14,16,29,0.86);
    padding:7px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.10);font-size:13px}
  .sync-lbl{color:#aeb6d6;font-weight:600}
  .sync-ctrl{display:flex;align-items:center;gap:8px}
  .step-btn{width:30px;height:26px;border:0;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;
    font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .step-btn:active{transform:scale(0.93)}
  #latVal{min-width:58px;text-align:center;font-family:ui-monospace,SFMono-Regular,monospace;font-weight:800;color:#fff;cursor:pointer}

  #menuStatus{margin:0;font-size:12px;text-align:center;color:#9ea6c8;min-height:16px}

  /* Botão Tocar Arcade */
  #startBtn{width:100%;padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.24);color:#fff;
    font-size:16px;font-weight:900;letter-spacing:0.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(135deg,#4caf7a 0%,#2d8a5e 55%,#236b4a 100%);
    box-shadow:0 6px 22px rgba(76,175,122,0.38);transition:transform .08s,opacity .15s}
  #startBtn:active:not(:disabled){transform:scale(0.98)}
  #startBtn:disabled{background:#232638;color:#6d7390;border-color:rgba(255,255,255,0.08);box-shadow:none;cursor:default}
  .start-pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,0.28)}

  /* Tela de Jogo */
  #gameScreen{padding:8px 8px 10px;gap:8px;background:#080912}
  .game-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
  .gbtn{padding:8px 12px;border-radius:10px;background:#1c1e30;border:1px solid #323650;color:#e6e8f6;
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .gbtn:active{transform:scale(0.96)}
  .game-meta{flex:1;min-width:0;text-align:center}
  #gameTitle{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gameSub{font-size:11px;font-weight:700;color:#4caf7a}
  canvas{flex:1;min-height:0;width:100%;border-radius:14px;border:1px solid #2b2f47;
    box-shadow:0 10px 30px rgba(0,0,0,0.55);touch-action:none;display:block;background:#090a14}

  /* Overlay de Fim de Música */
  #resultOverlay{position:absolute;inset:0;z-index:10;background:rgba(7,8,16,0.84);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .result-card{width:100%;max-width:340px;background:rgba(16,18,32,0.96);border:1px solid rgba(255,255,255,0.16);
    border-radius:20px;padding:20px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,0.65)}
  .result-tag{font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#4caf7a}
  .result-song{font-size:18px;font-weight:900;color:#fff;margin:4px 0 14px}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .stat-box{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px}
  .stat-lbl{font-size:11px;color:#9aa3c8;font-weight:700;text-transform:uppercase}
  .stat-val{font-size:18px;font-weight:900;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums}
  .result-actions{display:flex;gap:8px}
  .result-actions button{flex:1;padding:12px;border-radius:12px;border:0;font-size:14px;font-weight:800;cursor:pointer}
  .btn-replay{background:linear-gradient(135deg,#4caf7a,#2d8a5e);color:#fff}
  .btn-menu{background:#23263a;color:#e6e8f6;border:1px solid #393e5c !important}
</style>
</head>
<body>
<div class="app">
  <!-- TELA 1: MENU INICIAL / SETLIST -->
  <section id="menuScreen" class="screen">
    <img src="bg-partitura.jpg" alt="" class="bg-art">
    <div class="bg-scrim"></div>

    <header class="menu-head z1">
      <div class="brand">
        <div class="eq-icon" aria-hidden="true">
          <span class="eq-1"></span><span class="eq-2"></span><span class="eq-3"></span><span class="eq-4"></span>
        </div>
        <div>
          <div class="brand-title">
            <strong>RITMO</strong>
            <span class="brand-badge">MP3</span>
          </div>
          <div class="lane-dots" aria-hidden="true">
            <i style="background:#4caf7a"></i>
            <i style="background:#e05a5a"></i>
            <i style="background:#e6c84a"></i>
            <i style="background:#4a90e2"></i>
          </div>
        </div>
      </div>
      <label class="import-btn" for="file">+ Arquivo</label>
      <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg">
    </header>

    <div class="setlist-head z1">
      <span class="setlist-label" id="setlistCount">Setlist</span>
      <span class="setlist-meta" id="setlistMeta">Pronto</span>
    </div>

    <div id="songList" class="z1" role="listbox" aria-label="Músicas"></div>

    <div id="diffGroup" class="z1" role="group" aria-label="Dificuldade">
      <button type="button" class="dbtn" data-diff="easy">Fácil</button>
      <button type="button" class="dbtn" data-diff="medium">Médio</button>
      <button type="button" class="dbtn active" data-diff="hard">Difícil</button>
    </div>

    <div class="sync-bar z1">
      <span class="sync-lbl">🎧 Sincronia (atraso)</span>
      <div class="sync-ctrl">
        <button type="button" class="step-btn" id="latMinus" aria-label="Diminuir atraso">−</button>
        <span id="latVal" title="Toque para zerar">0 ms</span>
        <button type="button" class="step-btn" id="latPlus" aria-label="Aumentar atraso">+</button>
      </div>
    </div>

    <p id="menuStatus" class="z1">Escolha uma música do setlist ou importe um MP3.</p>

    <button type="button" id="startBtn" class="z1" disabled>
      <span>▶ TOCAR</span>
      <span class="start-pill" id="startPill">Difícil</span>
    </button>
  </section>

  <!-- TELA 2: JOGO EM TELA CHEIA -->
  <section id="gameScreen" class="screen hidden">
    <div class="game-bar">
      <button type="button" class="gbtn" id="backBtn">← Menu</button>
      <div class="game-meta">
        <div id="gameTitle">Ritmo MP3</div>
        <div id="gameSub">Difícil</div>
      </div>
      <button type="button" class="gbtn" id="pause" disabled>Pausar</button>
    </div>
    <canvas id="c"></canvas>

    <div id="resultOverlay" class="hidden">
      <div class="result-card">
        <div class="result-tag" id="resDiff">Show Concluído</div>
        <div class="result-song" id="resSong">Música</div>
        <div class="result-grid">
          <div class="stat-box"><div class="stat-lbl">Pontos</div><div class="stat-val" id="resScore">0</div></div>
          <div class="stat-box"><div class="stat-lbl">Precisão</div><div class="stat-val" id="resAcc">0%</div></div>
          <div class="stat-box"><div class="stat-lbl">Acertos</div><div class="stat-val" id="resHits">0/0</div></div>
          <div class="stat-box"><div class="stat-lbl">Melhor Combo</div><div class="stat-val" id="resCombo">0</div></div>
        </div>
        <div class="result-actions">
          <button type="button" class="btn-menu" id="resMenuBtn">← Menu</button>
          <button type="button" class="btn-replay" id="resReplayBtn">↻ Tocar de novo</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
let W = 400, H = 560, LW = 100, HIT_Y = 470, RAD = 22;

const DIFFS = {
  easy:   { label: 'Fácil',   color: '#4caf7a', fall: 2.05, window: 0.24, mult: 1.48, bias: 0.055, subdiv: 2, snap: 0.14, beatTol: 0.28, minGapFactor: 0.72, minGapFloor: 0.38, contourGain: 0.65 },
  medium: { label: 'Médio',   color: '#e6c84a', fall: 1.75, window: 0.21, mult: 1.24, bias: 0.036, subdiv: 2, snap: 0.11, beatTol: 0.34, minGapFactor: 0.42, minGapFloor: 0.22, contourGain: 0.90 },
  hard:   { label: 'Difícil', color: '#e05a5a', fall: 1.45, window: 0.18, mult: 1.05, bias: 0.022, subdiv: 4, snap: 0.08, beatTol: 0.42, minGapFactor: 0.21, minGapFloor: 0.115, contourGain: 1.15 }
};

let diffKey = 'hard';
let latencyMs = Number(localStorage.getItem('ritmo_lat_ms') || 0);
if (Number.isNaN(latencyMs)) latencyMs = 0;

const BEST_STORAGE_KEY = 'ritmo_best_scores_v1';
let bestScores = {};
try {
  bestScores = JSON.parse(localStorage.getItem(BEST_STORAGE_KEY) || '{}') || {};
} catch (e) { bestScores = {}; }

function getBestRecord(trackId, diff = diffKey) {
  if (!trackId) return null;
  return bestScores[`${trackId}__${diff}`] || null;
}

function saveBestRecord(trackId, diff, sc, acc, comboMax) {
  if (!trackId || sc <= 0) return false;
  const k = `${trackId}__${diff}`;
  const prev = bestScores[k];
  const isNew = !prev || sc > prev.score || (sc === prev.score && acc > (prev.acc || 0));
  if (isNew) {
    bestScores[k] = {
      score: sc,
      acc: acc,
      maxCombo: Math.max(comboMax, prev ? prev.maxCombo || 0 : 0),
      ts: Date.now()
    };
    try { localStorage.setItem(BEST_STORAGE_KEY, JSON.stringify(bestScores)); } catch (e) {}
  }
  return isNew;
}

const COLORS = ['#4caf7a', '#e05a5a', '#e6c84a', '#4a90e2'];
const KEYS = ['d', 'f', 'j', 'k'];
const DISC_COLORS = ['#4caf7a', '#4a90e2', '#e6c84a', '#e05a5a', '#9b72ff'];

let ctx, buffer, source, notes = [], startAt = 0, playing = false, paused = false, wake = null;
let score = 0, combo = 0, maxCombo = 0, hits = 0, misses = 0, detectedBpm = 0, busy = false;
let currentTrack = null;
let lastFrame = performance.now();

const flash = [0, 0, 0, 0], receptorPop = [0, 0, 0, 0], stringVib = [0, 0, 0];
const particles = [], rings = [], popups = [], comboBanners = [];

const COMBO_MILESTONES = {
  10:  { sub: 'NO RITMO!',   color: '#4caf7a', glow: 'rgba(76, 175, 122, 0.45)' },
  25:  { sub: 'AQUECENDO!',  color: '#e6c84a', glow: 'rgba(230, 200, 74, 0.50)' },
  50:  { sub: 'EM CHAMAS!',  color: '#ff7b54', glow: 'rgba(255, 123, 84, 0.55)' },
  100: { sub: 'LENDÁRIO!',   color: '#c77dff', glow: 'rgba(199, 125, 255, 0.65)' }
};

const bgImg = new Image();
let bgLoaded = false;
bgImg.onload = () => { bgLoaded = true; };
bgImg.src = 'bg-partitura.jpg';

const tracks = [];
let selectedIdx = -1;
const trackCache = new Map(); // id -> { buffer, bpm, duration }

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width || !r.height) return;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = r.width; H = r.height; LW = W / 4; HIT_Y = H - 86; RAD = Math.min(34, LW * 0.36);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

function formatDur(sec) {
  if (!sec || !Number.isFinite(sec)) return '';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// Pipeline MIR / DSP inspirado em Guitar Flash, Beatstar e Clone Hero:
// 1) Banco de 8 filtros musicais por oitava + separação Estéreo Mid/Side (destaca guitarras/bateria e reduz vogais sustentadas da voz)
// 2) Detecção combinada de ataques percussivos (bumbo, caixa, chimbal), palhetadas de guitarra/baixo e fluxo de mudança de nota (subidas/descidas)
// 3) Rastreamento dinâmico de batidas (Ellis DP Beat Tracker) que acompanha variações reais de tempo da banda
// 4) Mapeamento de pistas guiado pelo contorno melódico (subidas 0→1→2→3, descidas 3→2→1→0) e timbres da bateria
function analyzeAudio(buf) {
  if (buf._ritmoAnalysis) return buf._ritmoAnalysis;

  const ch0 = buf.getChannelData(0);
  const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
  const sr = buf.sampleRate;
  const hop = Math.max(256, Math.round(sr * 0.01)); // ~10 ms por frame (~100 fps)
  const n = Math.floor(ch0.length / hop);
  const fps = sr / hop;

  // 7 frequências de corte dividindo o espectro em 8 sub-bandas musicais:
  // B0: <105Hz (Bumbo/Sub), B1: 105-220Hz (Baixo/Guitarra grave), B2: 220-440Hz (Riff base/Corpo caixa),
  // B3: 440-880Hz (Guitarra média/Melodia), B4: 880-1760Hz (Solo/Agudos guitarra),
  // B5: 1760-3520Hz (Ataque de palheta/Esteira caixa), B6: 3520-6800Hz (Chimbal/Brilho), B7: >6800Hz (Pratos)
  const cutoffs = [105, 220, 440, 880, 1760, 3520, 6800];
  const alpha = cutoffs.map(fc => 1 - Math.exp(-2 * Math.PI * fc / sr));
  let s0a = 0, s0b = 0, s1a = 0, s1b = 0, s2a = 0, s2b = 0, s3a = 0, s3b = 0;
  let s4a = 0, s4b = 0, s5a = 0, s5b = 0, s6a = 0, s6b = 0;
  let sideLp = 0, sideHp = 0;
  const aSideLow = alpha[1], aSideHigh = alpha[5];

  const E = Array.from({ length: 8 }, () => new Float32Array(n));
  const linH = Array.from({ length: 5 }, () => new Float32Array(n)); // energia harmônica linear B1..B5
  const rmsAll = new Float32Array(n);
  const instWeight = new Float32Array(n);
  const rawPitch = new Float32Array(n);
  const pitch = new Float32Array(n);

  let prevHarmSample = 0;
  for (let i = 0; i < n; i++) {
    let e0 = 0, e1 = 0, e2 = 0, e3 = 0, e4 = 0, e5 = 0, e6 = 0, e7 = 0;
    let eAll = 0, eSide = 0, eMidHarm = 0, zc = 0;

    for (let j = i * hop, end = j + hop; j < end; j++) {
      const L = ch0[j], R = ch1 ? ch1[j] : L;
      const x = 0.5 * (L + R);
      const side = ch1 ? 0.5 * (L - R) : 0;

      s0a += alpha[0] * (x - s0a); s0b += alpha[0] * (s0a - s0b);
      s1a += alpha[1] * (x - s1a); s1b += alpha[1] * (s1a - s1b);
      s2a += alpha[2] * (x - s2a); s2b += alpha[2] * (s2a - s2b);
      s3a += alpha[3] * (x - s3a); s3b += alpha[3] * (s3a - s3b);
      s4a += alpha[4] * (x - s4a); s4b += alpha[4] * (s4a - s4b);
      s5a += alpha[5] * (x - s5a); s5b += alpha[5] * (s5a - s5b);
      s6a += alpha[6] * (x - s6a); s6b += alpha[6] * (s6a - s6b);

      const b0 = s0b;
      const b1 = s1b - s0b;
      const b2 = s2b - s1b;
      const b3 = s3b - s2b;
      const b4 = s4b - s3b;
      const b5 = s5b - s4b;
      const b6 = s6b - s5b;
      const b7 = x - s6b;

      e0 += b0 * b0; e1 += b1 * b1; e2 += b2 * b2; e3 += b3 * b3;
      e4 += b4 * b4; e5 += b5 * b5; e6 += b6 * b6; e7 += b7 * b7;
      eAll += x * x;

      // Canal Side filtrado na região de guitarras/instrumentos (220-3520 Hz)
      sideLp += aSideHigh * (side - sideLp);
      sideHp += aSideLow * (sideLp - sideHp);
      const sideInst = sideLp - sideHp;
      eSide += sideInst * sideInst;

      const harm = b1 + b2 + b3 + 0.7 * b4;
      eMidHarm += harm * harm;
      if ((harm >= 0) !== (prevHarmSample >= 0)) zc++;
      prevHarmSample = harm;
    }

    const r0 = Math.sqrt(e0 / hop), r1 = Math.sqrt(e1 / hop), r2 = Math.sqrt(e2 / hop), r3 = Math.sqrt(e3 / hop);
    const r4 = Math.sqrt(e4 / hop), r5 = Math.sqrt(e5 / hop), r6 = Math.sqrt(e6 / hop), r7 = Math.sqrt(e7 / hop);
    linH[0][i] = r1; linH[1][i] = r2; linH[2][i] = r3; linH[3][i] = r4; linH[4][i] = r5;

    E[0][i] = Math.log1p(140 * r0);
    E[1][i] = Math.log1p(140 * r1);
    E[2][i] = Math.log1p(140 * r2);
    E[3][i] = Math.log1p(140 * r3);
    E[4][i] = Math.log1p(140 * r4);
    E[5][i] = Math.log1p(140 * r5);
    E[6][i] = Math.log1p(140 * r6);
    E[7][i] = Math.log1p(140 * r7);
    rmsAll[i] = Math.sqrt(eAll / hop);

    // Peso instrumental: guitarras/teclados têm forte imagem estéreo (Side) ou harmônicos graves/agudos de palheta,
    // enquanto a voz principal fica centralizada em B3/B4
    const sideRatio = ch1 ? Math.sqrt(eSide / (eMidHarm + 1e-7)) : 0.35;
    instWeight[i] = Math.min(1.45, 0.85 + 0.80 * sideRatio);

    // Altura tonal (pitch contínuo em oitavas): combina centroide das bandas harmônicas B1..B5 + ZCR harmônico
    const hSum = r1 + r2 + r3 + r4 + 0.75 * r5 + 1e-6;
    const specCentroid = (1.0 * r1 + 2.0 * r2 + 3.0 * r3 + 4.0 * r4 + 5.0 * 0.75 * r5) / hSum;
    const f0 = Math.max(65, Math.min(1800, (zc * fps) * 0.5));
    const zcrOct = Math.log2(f0 / 65); // 65Hz (C2) = 0, 130Hz = 1, 260Hz = 2, 520Hz = 3, 1040Hz = 4
    rawPitch[i] = 0.64 * specCentroid + 0.36 * zcrOct;
  }

  // Suavização leve de 30ms na curva de pitch para eliminar jitter de fase
  for (let i = 0; i < n; i++) {
    const p0 = rawPitch[Math.max(0, i - 1)];
    const p1 = rawPitch[i];
    const p2 = rawPitch[Math.min(n - 1, i + 1)];
    pitch[i] = 0.25 * p0 + 0.50 * p1 + 0.25 * p2;
  }

  const odf = new Float32Array(n);
  const drumOdf = new Float32Array(n);
  const contourOdf = new Float32Array(n);
  const frameKind = new Uint8Array(n); // 0=guitar/melody, 1=kick, 2=snare, 3=hat

  for (let i = 3; i < n; i++) {
    const df0 = Math.max(0, E[0][i] - (0.65 * E[0][i - 1] + 0.35 * E[0][i - 2]));
    const df1 = Math.max(0, E[1][i] - (0.65 * E[1][i - 1] + 0.35 * E[1][i - 2]));
    const df2 = Math.max(0, E[2][i] - (0.65 * E[2][i - 1] + 0.35 * E[2][i - 2]));
    const df3 = Math.max(0, E[3][i] - (0.65 * E[3][i - 1] + 0.35 * E[3][i - 2]));
    const df4 = Math.max(0, E[4][i] - (0.65 * E[4][i - 1] + 0.35 * E[4][i - 2]));
    const df5 = Math.max(0, E[5][i] - (0.65 * E[5][i - 1] + 0.35 * E[5][i - 2]));
    const df6 = Math.max(0, E[6][i] - (0.65 * E[6][i - 1] + 0.35 * E[6][i - 2]));
    const df7 = Math.max(0, E[7][i] - (0.65 * E[7][i - 1] + 0.35 * E[7][i - 2]));

    // 1. Bateria: Bumbo (Kick), Caixa (Snare = corpo médio + esteira aguda simultânea) e Chimbal/Pratos
    const kick = 1.50 * df0 + 0.85 * df1;
    const snareCoinc = (df2 + df3 > 0.045 && df5 + df6 > 0.045) ? 1.38 : 0.82;
    const snare = (0.55 * df2 + 0.45 * df3 + 0.90 * df5 + 0.65 * df6) * snareCoinc;
    const hat = 1.05 * df6 + 1.20 * df7;

    // 2. Ataque de guitarra / baixo / teclado (reforçado quando há transiente de palheta em B4..B6)
    const pickAttack = (df4 + df5 + df6 > 0.05) ? 1.26 : 0.92;
    // Penaliza vogais lentas de voz centralizada quando não há ataque percussivo nem abertura estéreo
    const vocalVeto = (instWeight[i] < 0.96 && df0 + df1 + df5 + df6 < 0.04) ? 0.58 : 1.0;
    const guitar = (1.10 * df1 + 1.35 * df2 + 1.25 * df3 + 1.20 * df4 + 0.85 * df5) * instWeight[i] * pickAttack * vocalVeto;

    // 3. Fluxo harmônico de mudança de nota ("Subidas e Descidas"):
    // Detecta quando o instrumento muda de nota (energia migra entre B1..B5) mesmo se o volume total for constante
    const sumNow = linH[0][i] + linH[1][i] + linH[2][i] + linH[3][i] + linH[4][i] + 1e-6;
    const sumPrev = linH[0][i - 3] + linH[1][i - 3] + linH[2][i - 3] + linH[3][i - 3] + linH[4][i - 3] + 1e-6;
    let profileShift = 0;
    for (let b = 0; b < 5; b++) {
      profileShift += Math.abs(linH[b][i] / sumNow - linH[b][i - 3] / sumPrev);
    }
    const pitchDelta = Math.abs(pitch[i] - pitch[i - 3]);
    const harmConf = Math.min(1.15, Math.max(0, (E[1][i] + E[2][i] + E[3][i] + E[4][i]) * 0.14));
    const contour = Math.max(0, (profileShift * 0.75 + pitchDelta * 0.85) - 0.10) * harmConf * instWeight[i] * vocalVeto;

    drumOdf[i] = 1.25 * kick + 1.20 * snare + 0.65 * hat;
    contourOdf[i] = contour;
    odf[i] = drumOdf[i] + 1.30 * guitar + 1.05 * contour;

    // Classifica o evento predominante do frame para auxiliar no mapeamento das cordas
    const gScore = guitar + contour * 1.2;
    if (kick * 1.25 >= gScore && kick >= snare && kick >= hat) frameKind[i] = 1;
    else if (snare * 1.15 >= gScore && snare >= kick && snare >= hat) frameKind[i] = 2;
    else if (hat * 1.15 > gScore && hat > kick && hat > snare) frameKind[i] = 3;
    else frameKind[i] = 0;
  }

  // Estimativa de BPM por autocorrelação perceptual (74–172 BPM) com verificação de harmônicos (meio-tempo / dobro)
  const pulse = new Float32Array(n);
  for (let i = 0; i < n; i++) pulse[i] = 0.62 * drumOdf[i] + 0.38 * odf[i];

  const lagMin = Math.max(4, Math.floor(fps * 60 / 172));
  const lagMax = Math.min(Math.floor(n / 3), Math.ceil(fps * 60 / 74));
  const winStart = Math.floor(n * 0.08);
  const winEnd = Math.min(n - lagMax * 2 - 2, winStart + Math.floor(fps * 75));
  const corr = new Float32Array(lagMax + 1);

  for (let lag = lagMin; lag <= lagMax; lag++) {
    let sum = 0;
    for (let i = winStart; i < winEnd; i += 2) {
      sum += pulse[i] * pulse[i + lag] + 0.5 * pulse[i] * pulse[i + lag * 2];
    }
    const bpm = 60 * fps / lag;
    const prior = Math.exp(-0.5 * Math.pow((bpm - 122) / 38, 2));
    corr[lag] = sum * (0.72 + 0.28 * prior);
  }

  let bestLag = Math.round(fps * 0.5), bestCorr = -1;
  for (let lag = lagMin; lag <= lagMax; lag++) {
    if (corr[lag] > bestCorr) { bestCorr = corr[lag]; bestLag = lag; }
  }
  const beatSec = bestLag / fps;
  const bpmEst = Math.round(60 / beatSec);

  // Ellis Dynamic Programming Beat Tracker: encontra a sequência exata de batidas acompanhando variações da banda
  const backlink = new Int32Array(n).fill(-1);
  const cumScore = new Float32Array(n);
  const minStep = Math.max(lagMin, Math.round(bestLag * 0.82));
  const maxStep = Math.min(lagMax + 10, Math.round(bestLag * 1.18));

  // Suaviza o pulso com janela de ~30ms para o rastreador de batidas
  let meanPulse = 0;
  for (let i = 0; i < n; i++) meanPulse += pulse[i];
  meanPulse = meanPulse / Math.max(1, n);
  const tightness = 3.2 * meanPulse;

  for (let i = 0; i < n; i++) {
    const localP = 0.25 * pulse[Math.max(0, i - 1)] + 0.50 * pulse[i] + 0.25 * pulse[Math.min(n - 1, i + 1)];
    let bestPrev = -1, maxScore = localP;
    if (i >= minStep) {
      const hi = Math.min(i, maxStep);
      for (let lag = minStep; lag <= hi; lag++) {
        const prevIdx = i - lag;
        const diff = Math.log(lag / bestLag);
        const cand = cumScore[prevIdx] + localP - tightness * diff * diff;
        if (cand > maxScore) { maxScore = cand; bestPrev = prevIdx; }
      }
    }
    cumScore[i] = maxScore;
    backlink[i] = bestPrev;
  }

  let endBeat = n - 1, endBest = -1;
  for (let i = Math.max(0, n - maxStep * 2); i < n; i++) {
    if (cumScore[i] > endBest) { endBest = cumScore[i]; endBeat = i; }
  }
  const beatList = [];
  for (let cur = endBeat; cur >= 0; cur = backlink[cur]) beatList.push(cur);
  beatList.reverse();
  if (beatList.length < 2) {
    beatList.length = 0;
    for (let f = 0; f < n; f += bestLag) beatList.push(f);
  }

  // Calcula a fase contínua de batida em cada frame (0.0 = cabeça do tempo, 0.5 = contratempo/colcheia)
  const beatPhase = new Float32Array(n);
  const localBeatSec = new Float32Array(n).fill(beatSec);
  let bIdx = 0;
  for (let i = 0; i < n; i++) {
    while (bIdx < beatList.length - 2 && i >= beatList[bIdx + 1]) bIdx++;
    const b0 = beatList[bIdx];
    const b1 = beatList[Math.min(beatList.length - 1, bIdx + 1)];
    const span = Math.max(minStep, b1 - b0);
    localBeatSec[i] = span / fps;
    const rawPh = (i - b0) / span;
    beatPhase[i] = ((rawPh % 1) + 1) % 1;
  }

  const result = { n, fps, beatSec, bpm: bpmEst, rmsAll, odf, drumOdf, contourOdf, pitch, frameKind, beatPhase, localBeatSec };
  buf._ritmoAnalysis = result;
  return result;
}

function makeNotes(buf, key = diffKey) {
  const cfg = DIFFS[key];
  const an = analyzeAudio(buf);
  const { n, fps, beatSec, bpm, rmsAll, odf, drumOdf, contourOdf, pitch, frameKind, beatPhase, localBeatSec } = an;
  detectedBpm = bpm;

  // Janela deslizante de ~1.2s para limiar adaptativo local
  const R = Math.round(fps * 0.60);
  const winArr = new Float32Array(2 * R + 1);
  const candidates = [];

  for (let i = 3; i < n - 3; i++) {
    if (rmsAll[i] < 0.008) continue;
    const val = odf[i] + (cfg.contourGain - 1) * contourOdf[i];
    const prevVal = odf[i - 1] + (cfg.contourGain - 1) * contourOdf[i - 1];
    const nextVal = odf[i + 1] + (cfg.contourGain - 1) * contourOdf[i + 1];
    if (val < prevVal || val < nextVal) continue;

    let k = 0, sumWin = 0;
    const j0 = Math.max(0, i - R), j1 = Math.min(n - 1, i + R);
    for (let j = j0; j <= j1; j += 2) {
      const v = odf[j];
      winArr[k++] = v;
      sumWin += v;
    }
    const slice = winArr.subarray(0, k).sort();
    const med = slice[k >> 1];
    const mean = sumWin / Math.max(1, k);
    const thresh = cfg.mult * (0.65 * med + 0.35 * mean) + cfg.bias;
    if (val <= thresh) continue;

    // Avaliação métrica local em relação às batidas reais da banda
    const ph = beatPhase[i];
    const d1 = Math.min(ph, 1 - ph); // distância para a cabeça do tempo (1/1)
    const d2 = Math.min(d1, Math.abs(ph - 0.5)); // colcheia (1/2)
    const d3 = Math.min(Math.abs(ph - 1 / 3), Math.abs(ph - 2 / 3)); // tercina (1/3)
    const d4 = Math.min(d2, Math.abs(ph - 0.25), Math.abs(ph - 0.75), d3); // semicolcheia/tercina

    let metricBonus = 1.0;
    let subDist = d4;
    let nearestSubPhase = ph;

    if (d1 <= 0.14) {
      metricBonus = 1.32;
      subDist = d1;
      nearestSubPhase = ph > 0.5 ? 1 : 0;
    } else if (d2 <= 0.14) {
      metricBonus = key === 'easy' ? 1.12 : 1.22;
      subDist = d2;
      nearestSubPhase = 0.5;
    } else if (cfg.subdiv >= 4 && d4 <= 0.12) {
      metricBonus = 1.12;
      subDist = d4;
      const subs = [0.25, 1 / 3, 2 / 3, 0.75];
      nearestSubPhase = subs.reduce((a, b) => Math.abs(ph - b) < Math.abs(ph - a) ? b : a, 0.25);
    }

    const strengthRatio = val / (thresh + 1e-6);
    const isStrongAccent = strengthRatio > (key === 'easy' ? 1.55 : key === 'medium' ? 1.38 : 1.20);
    const activeGridDist = key === 'easy' ? d2 : d4;
    if (activeGridDist > cfg.beatTol * 0.5 && !isStrongAccent) continue;

    // Interpolação parabólica sub-frame para cravar o instante exato do transiente acústico
    const denom = prevVal - 2 * val + nextVal;
    const fracOffset = Math.abs(denom) > 1e-6 ? Math.max(-0.45, Math.min(0.45, 0.5 * (prevVal - nextVal) / denom)) : 0;
    const rawT = (i + fracOffset) / fps;

    // Micro-ajuste suave à subdivisão local (máximo ±10 ms) sem tirar a nota do som real
    const phaseErrSec = (nearestSubPhase - ph) * localBeatSec[i];
    const nudge = Math.abs(phaseErrSec) <= 0.032 ? phaseErrSec * cfg.snap : 0;
    const t = rawT + nudge;
    if (t < 0.18) continue;

    // Lê o pitch ~20ms APÓS o ataque inicial para capturar a nota real da corda/voz (e não o ruído da palhetada)
    const pitchFrame = Math.min(n - 1, i + 2);
    const notePitch = 0.65 * pitch[pitchFrame] + 0.35 * pitch[Math.min(n - 1, i + 3)];

    candidates.push({
      t,
      salience: val * metricBonus,
      pitch: notePitch,
      kind: frameKind[i],
      onBeat: d1 <= 0.14,
      hit: false,
      missed: false
    });
  }

  // Filtragem de densidade mínima por dificuldade (preservando sempre a nota de maior saliência musical)
  const minGap = Math.max(cfg.minGapFloor, beatSec * cfg.minGapFactor);
  const out = [];
  for (const c of candidates) {
    const prev = out[out.length - 1];
    if (!prev || c.t - prev.t >= minGap) {
      out.push(c);
    } else if (c.salience > prev.salience * 1.08) {
      out[out.length - 1] = c;
    }
  }

  if (!out.length) return out;

  // Mapeamento de Pistas guiado por Contorno Melódico ("Subidas e Descidas") + Timbre Instrumental
  const sortedPitches = out.map(o => o.pitch).slice().sort((a, b) => a - b);
  const qPitch = p => sortedPitches[Math.min(sortedPitches.length - 1, Math.floor(sortedPitches.length * p))] ?? 0;
  const gMin = qPitch(0.08), gMax = Math.max(gMin + 0.25, qPitch(0.92));

  // Calcula a sensibilidade a degraus de nota (subida/descida) com base na variação real da música
  const pitchDiffs = [];
  for (let i = 1; i < out.length; i++) {
    if (out[i].t - out[i - 1].t < 0.85) pitchDiffs.push(Math.abs(out[i].pitch - out[i - 1].pitch));
  }
  pitchDiffs.sort((a, b) => a - b);
  const stepThresh = Math.max(0.045, (pitchDiffs[Math.floor(pitchDiffs.length * 0.38)] ?? 0.08) * 0.85);

  let sameLaneCount = 0;
  let lastDir = 1;

  for (let i = 0; i < out.length; i++) {
    const o = out[i];

    // Janela de frase local (±6 notas, ~2.5s) para normalizar a altura da nota dentro do riff/frase atual
    let lMin = o.pitch, lMax = o.pitch;
    for (let j = Math.max(0, i - 6); j <= Math.min(out.length - 1, i + 6); j++) {
      if (Math.abs(out[j].t - o.t) <= 3.0) {
        if (out[j].pitch < lMin) lMin = out[j].pitch;
        if (out[j].pitch > lMax) lMax = out[j].pitch;
      }
    }
    const localNorm = lMax - lMin > 0.12 ? (o.pitch - lMin) / (lMax - lMin) : 0.5;
    const globalNorm = Math.max(0, Math.min(1, (o.pitch - gMin) / (gMax - gMin)));
    let pos = (0.65 * localNorm + 0.35 * globalNorm) * 3.99;

    // Âncoras naturais de bateria quando o evento é predominantemente percussivo
    if (o.kind === 1) pos = Math.min(1.6, pos * 0.55); // Bumbo -> cordas graves (0 ou 1)
    else if (o.kind === 3) pos = Math.max(2.1, 1.4 + pos * 0.65); // Chimbal/Prato -> cordas agudas (2 ou 3)

    let lane = Math.max(0, Math.min(3, Math.floor(pos)));

    if (i > 0) {
      const prev = out[i - 1];
      const dt = o.t - prev.t;
      const dp = o.pitch - prev.pitch;

      if (dt <= 0.90) {
        if (dp > stepThresh) {
          // SUBIDA melódica / de guitarra: avança para a direita nas cordas
          const bigJump = dp > stepThresh * 2.5 && pos - prev.lane >= 1.75;
          if (prev.lane < 3) {
            lane = Math.min(3, prev.lane + (bigJump ? 2 : 1));
          } else {
            // Já estava na corda 3 e a frase continua subindo: faz shift de oitava (volta para 1 ou 2) para continuar subindo
            lane = (i + 1 < out.length && out[i + 1].pitch > o.pitch) ? 1 : 2;
          }
          lastDir = 1;
        } else if (dp < -stepThresh) {
          // DESCIDA melódica / de guitarra: avança para a esquerda nas cordas
          const bigDrop = dp < -stepThresh * 2.5 && prev.lane - pos >= 1.75;
          if (prev.lane > 0) {
            lane = Math.max(0, prev.lane - (bigDrop ? 2 : 1));
          } else {
            // Já estava na corda 0 e a frase continua descendo: faz shift de oitava (vai para 2 ou 1)
            lane = (i + 1 < out.length && out[i + 1].pitch < o.pitch) ? 2 : 1;
          }
          lastDir = -1;
        } else {
          // Mesma nota / batida sustentada
          if (o.kind === 1) lane = prev.lane === 0 && dt < 0.22 ? 1 : 0;
          else if (o.kind === 2) lane = prev.lane === 1 ? 2 : 1;
          else if (o.kind === 3) lane = prev.lane === 3 && dt < 0.22 ? 2 : 3;
          else lane = prev.lane;

          // Em notas rápidas repetidas (<220ms), alterna entre cordas vizinhas (estilo palhetada alternada / rolo de bateria)
          if (lane === prev.lane && dt < 0.22) {
            const alt = prev.lane + lastDir;
            lane = (alt >= 0 && alt <= 3) ? alt : (prev.lane > 0 ? prev.lane - 1 : 1);
            lastDir = -lastDir;
          }
        }
      }

      if (lane === prev.lane) {
        sameLaneCount++;
        if (sameLaneCount >= 2) {
          lane = prev.lane === 3 ? 2 : prev.lane === 0 ? 1 : prev.lane + (pos >= prev.lane ? 1 : -1);
          sameLaneCount = 0;
        }
      } else {
        sameLaneCount = 0;
      }
    }

    o.lane = Math.max(0, Math.min(3, lane));
  }

  return out;
}

function decode(ab) {
  return new Promise((ok, fail) => {
    const p = ctx.decodeAudioData(ab, ok, fail);
    if (p && p.catch) p.catch(fail);
  });
}

function ensureCtx() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
}

function updateLatDisplay() {
  $('latVal').textContent = (latencyMs > 0 ? '+' : '') + latencyMs + ' ms';
}
updateLatDisplay();
$('latMinus').onclick = () => {
  latencyMs = Math.max(-200, latencyMs - 10);
  localStorage.setItem('ritmo_lat_ms', String(latencyMs));
  updateLatDisplay();
};
$('latPlus').onclick = () => {
  latencyMs = Math.min(200, latencyMs + 10);
  localStorage.setItem('ritmo_lat_ms', String(latencyMs));
  updateLatDisplay();
};
$('latVal').onclick = () => {
  latencyMs = 0;
  localStorage.setItem('ritmo_lat_ms', '0');
  updateLatDisplay();
};

function renderSongList() {
  const list = $('songList');
  list.innerHTML = '';
  const cfg = DIFFS[diffKey];
  $('setlistCount').textContent = `Setlist · ${tracks.length} ${tracks.length === 1 ? 'faixa' : 'faixas'}`;

  if (!tracks.length) {
    list.innerHTML = '<div style="padding:18px;text-align:center;color:#8e96b8;font-size:13px;border:1px dashed rgba(255,255,255,0.14);border-radius:14px">Nenhuma música em musicas.json.<br>Use <b>+ Arquivo</b> acima para tocar um MP3.</div>';
    $('startBtn').disabled = true;
    return;
  }

  tracks.forEach((tr, idx) => {
    const active = idx === selectedIdx;
    const cached = trackCache.get(tr.id);
    const best = getBestRecord(tr.id, diffKey);
    const color = DISC_COLORS[idx % DISC_COLORS.length];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'song-card' + (active ? ' active' : '');
    const dur = cached ? ` · ${formatDur(cached.duration)}` : '';
    const bpmInfo = cached && cached.bpm ? ` · ${cached.bpm} BPM` : '';
    const rightTop = best ? `🏆 ${best.score.toLocaleString('pt-BR')}` : (cached && cached.bpm ? `${cached.bpm} BPM` : '—');
    const rightSub = best ? `Recorde (${best.acc}%)` : `Sem nota · ${cfg.label}`;

    btn.innerHTML = `
      <div class="song-disc" style="background:${active ? `linear-gradient(135deg,${color},#151828)` : '#181b2e'}">${active ? '♪' : idx + 1}</div>
      <div class="song-info">
        <div class="song-title">${escapeHtml(tr.titulo)}</div>
        <div class="song-sub">${escapeHtml(tr.artista || 'Biblioteca')}${dur}${bpmInfo}</div>
      </div>
      <div class="song-right">
        <div class="song-bpm${best ? ' has-best' : ''}">${rightTop}</div>
        <div class="song-bpm-lbl${best ? ' has-best' : ''}">${escapeHtml(rightSub)}</div>
      </div>`;
    btn.onclick = () => {
      if (busy) return;
      selectedIdx = idx;
      renderSongList();
      updateMenuInfo();
    };
    list.appendChild(btn);
  });

  $('startBtn').disabled = selectedIdx < 0;
}

function updateMenuInfo() {
  const cfg = DIFFS[diffKey];
  $('startPill').textContent = cfg.label;
  if (selectedIdx < 0 || !tracks[selectedIdx]) return;
  const tr = tracks[selectedIdx];
  const cached = trackCache.get(tr.id);
  const best = getBestRecord(tr.id, diffKey);
  if (best) {
    $('setlistMeta').textContent = `🏆 ${best.score.toLocaleString('pt-BR')} pts (${cfg.label})`;
  } else if (cached) {
    $('setlistMeta').textContent = `${cached.bpm} BPM · ${cfg.label}`;
  } else {
    $('setlistMeta').textContent = cfg.label;
  }

  if (cached) {
    $('menuStatus').textContent = best
      ? `${tr.titulo} · Melhor em ${cfg.label}: ${best.score.toLocaleString('pt-BR')} pts (${best.acc}%)`
      : `${tr.titulo} pronto · ${cfg.label}`;
  } else {
    $('menuStatus').textContent = best
      ? `Selecionada: ${tr.titulo} · Recorde (${cfg.label}): ${best.score.toLocaleString('pt-BR')} pts`
      : `Selecionada: ${tr.titulo} — toque em Tocar`;
  }
}

document.querySelectorAll('#diffGroup .dbtn').forEach(btn => {
  btn.onclick = () => {
    if (busy) return;
    diffKey = btn.dataset.diff;
    document.querySelectorAll('#diffGroup .dbtn').forEach(b => b.classList.toggle('active', b === btn));
    renderSongList();
    updateMenuInfo();
  };
});

async function loadLibrary() {
  try {
    let res;
    try { res = await fetch('musicas.json', { cache: 'no-store' }); }
    catch (e) { res = await fetch('musicas.json'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (Array.isArray(data)) {
      data.forEach((item, i) => {
        if (item && item.arquivo) {
          tracks.push({
            id: 'lib:' + item.arquivo,
            titulo: item.titulo || item.arquivo,
            artista: item.artista || 'Biblioteca',
            arquivo: item.arquivo
          });
        }
      });
    }
  } catch (e) {}
  if (tracks.length > 0) selectedIdx = 0;
  renderSongList();
  updateMenuInfo();
}

$('file').onchange = async ev => {
  const file = ev.target.files[0];
  if (!file || busy) return;
  busy = true;
  $('startBtn').disabled = true;
  $('menuStatus').textContent = 'Analisando arquivo do aparelho...';
  try {
    ensureCtx();
    const buf = await decode(await file.arrayBuffer());
    const tmpNotes = makeNotes(buf, diffKey);
    const title = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ');
    const localId = 'local:' + file.name;
    trackCache.set(localId, { buffer: buf, bpm: detectedBpm, duration: buf.duration });
    const existing = tracks.findIndex(t => t.id === localId);
    const entry = { id: localId, titulo: title, artista: 'Arquivo do aparelho', arquivo: null };
    if (existing >= 0) tracks[existing] = entry;
    else tracks.unshift(entry);
    selectedIdx = tracks.findIndex(t => t.id === localId);
    renderSongList();
    updateMenuInfo();
    $('menuStatus').textContent = `${tmpNotes.length} notas prontas (${DIFFS[diffKey].label}).`;
    $('startBtn').disabled = false;
  } catch (err) {
    $('menuStatus').textContent = 'Não consegui ler esse arquivo. Tente MP3 ou M4A.';
    $('startBtn').disabled = selectedIdx < 0;
  } finally {
    busy = false;
    ev.target.value = '';
  }
};

function showScreen(name) {
  $('menuScreen').classList.toggle('hidden', name !== 'menu');
  $('gameScreen').classList.toggle('hidden', name !== 'game');
  if (name === 'game') resize();
}

function stop() {
  if (source) { source.onended = null; try { source.stop(); } catch (e) {} source = null; }
  playing = false;
  paused = false;
  $('pause').disabled = true;
  $('pause').textContent = 'Pausar';
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
}

function startPlayback(tr, buf, bpm) {
  stop();
  currentTrack = tr;
  const cfg = DIFFS[diffKey];
  notes = makeNotes(buf, diffKey);
  buffer = buf;
  detectedBpm = bpm || detectedBpm;

  $('gameTitle').textContent = tr.titulo;
  $('gameSub').textContent = `${cfg.label}${detectedBpm ? ` · ${detectedBpm} BPM` : ''}`;
  $('gameSub').style.color = cfg.color;
  $('resultOverlay').classList.add('hidden');
  showScreen('game');

  notes.forEach(o => { o.hit = o.missed = false; });
  score = combo = maxCombo = hits = misses = 0;
  particles.length = rings.length = popups.length = comboBanners.length = 0;
  stringVib.fill(0);

  source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  startAt = ctx.currentTime + cfg.fall;
  source.start(startAt);
  source.onended = () => {
    playing = false;
    paused = false;
    $('pause').disabled = true;
    $('pause').textContent = 'Pausar';
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    showResults(tr);
  };
  playing = true;
  paused = false;
  $('pause').disabled = false;
  $('pause').textContent = 'Pausar';
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
}

function showResults(tr) {
  const acc = Math.round((hits / Math.max(1, hits + misses)) * 100);
  const isNew = saveBestRecord(tr.id, diffKey, score, acc, maxCombo);
  const best = getBestRecord(tr.id, diffKey);
  renderSongList();
  updateMenuInfo();

  if (isNew && score > 0) {
    $('resDiff').textContent = `★ NOVO RECORDE! · ${DIFFS[diffKey].label} ★`;
    $('resDiff').style.color = '#ffe270';
  } else {
    const bestTxt = best ? ` · Recorde: ${best.score.toLocaleString('pt-BR')}` : '';
    $('resDiff').textContent = `Show Concluído · ${DIFFS[diffKey].label}${bestTxt}`;
    $('resDiff').style.color = '#4caf7a';
  }
  $('resSong').textContent = tr.titulo;
  $('resScore').textContent = score.toLocaleString('pt-BR');
  $('resAcc').textContent = `${acc}%`;
  $('resHits').textContent = `${hits}/${notes.length}`;
  $('resCombo').textContent = String(maxCombo);
  $('resultOverlay').classList.remove('hidden');
}

$('startBtn').onclick = async () => {
  if (busy || selectedIdx < 0 || !tracks[selectedIdx]) return;
  const tr = tracks[selectedIdx];
  busy = true;
  $('startBtn').disabled = true;

  // Destrava o AudioContext dentro do clique (essencial no Safari/iOS)
  ensureCtx();
  const unlock = ctx.state === 'running' ? Promise.resolve() : ctx.resume().catch(() => {});

  try {
    let cached = trackCache.get(tr.id);
    if (!cached) {
      $('menuStatus').textContent = `Baixando "${tr.titulo}"...`;
      const res = await fetch(tr.arquivo);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const ab = await res.arrayBuffer();
      $('menuStatus').textContent = `Mapeando instrumentos de "${tr.titulo}"...`;
      await unlock;
      const buf = await decode(ab);
      makeNotes(buf, diffKey);
      cached = { buffer: buf, bpm: detectedBpm, duration: buf.duration };
      trackCache.set(tr.id, cached);
      renderSongList();
    } else {
      await unlock;
    }
    startPlayback(tr, cached.buffer, cached.bpm);
  } catch (err) {
    $('menuStatus').textContent = 'Erro ao carregar a música. Verifique o arquivo ou conexão.';
  } finally {
    busy = false;
    $('startBtn').disabled = selectedIdx < 0;
    updateMenuInfo();
  }
};

function togglePause() {
  if (!playing || !ctx) return;
  if (!paused) {
    paused = true;
    ctx.suspend().catch(() => {});
    $('pause').textContent = 'Continuar';
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  } else {
    ctx.resume().catch(() => {}).then(() => {
      paused = false;
      $('pause').textContent = 'Pausar';
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
    });
  }
}
$('pause').onclick = togglePause;

function returnToMenu() {
  if (currentTrack && score > 0) {
    const acc = Math.round((hits / Math.max(1, hits + misses)) * 100);
    saveBestRecord(currentTrack.id, diffKey, score, acc, maxCombo);
  }
  stop();
  $('resultOverlay').classList.add('hidden');
  showScreen('menu');
  renderSongList();
  updateMenuInfo();
}
$('backBtn').onclick = returnToMenu;
$('resMenuBtn').onclick = returnToMenu;
$('resReplayBtn').onclick = () => {
  if (selectedIdx < 0 || !tracks[selectedIdx]) return;
  const tr = tracks[selectedIdx];
  const cached = trackCache.get(tr.id);
  if (cached) {
    ensureCtx();
    const unlock = ctx.state === 'running' ? Promise.resolve() : ctx.resume().catch(() => {});
    unlock.then(() => startPlayback(tr, cached.buffer, cached.bpm));
  }
};

function spawnHitEffect(lane, label, pts) {
  const x = lane * LW + LW / 2, y = HIT_Y, color = COLORS[lane];
  receptorPop[lane] = 1;
  if (lane > 0) stringVib[lane - 1] = 1;
  if (lane < 3) stringVib[lane] = 1;
  rings.push({ x, y, r: RAD * 0.9, maxR: RAD * 2.4, color, life: 1 });
  rings.push({ x, y, r: RAD * 0.5, maxR: RAD * 1.7, color: '#ffffff', life: 0.85 });
  for (let i = 0; i < 14; i++) {
    const ang = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.35;
    const spd = 90 + Math.random() * 170;
    particles.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 45,
      size: 2.5 + Math.random() * 3.5, color: i % 4 === 0 ? '#ffffff' : color, life: 1
    });
  }
  popups.push({ x, y: y - RAD - 10, text: `${label} +${pts}`, color, life: 1 });
}

function triggerComboBanner(count) {
  const m = COMBO_MILESTONES[count];
  if (!m) return;
  comboBanners.push({
    title: `${count} NOTAS!`, sub: m.sub, color: m.color, glow: m.glow,
    life: 1, duration: count >= 50 ? 2.1 : 1.7
  });
}

function press(lane) {
  if (paused) return;
  flash[lane] = 1;
  if (!playing) return;
  const win = DIFFS[diffKey].window;
  const now = ctx.currentTime - startAt - latencyMs / 1000;
  let best = null;
  for (const o of notes) {
    if (o.t > now + win) break;
    if (o.lane === lane && !o.hit && !o.missed && Math.abs(o.t - now) <= win &&
        (!best || Math.abs(o.t - now) < Math.abs(best.t - now))) best = o;
  }
  if (best) {
    best.hit = true;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    hits++;
    const mult = Math.min(4, 1 + Math.floor(combo / 10));
    const pts = 10 * mult;
    score += pts;
    const err = Math.abs(best.t - now);
    const label = err <= win * 0.35 ? 'PERFEITO!' : err <= win * 0.7 ? 'ÓTIMO!' : 'BOM!';
    spawnHitEffect(lane, label, pts);
    triggerComboBanner(combo);
    if (navigator.vibrate) navigator.vibrate(10);
  } else {
    combo = 0;
  }
}

addEventListener('keydown', ev => {
  if ($('gameScreen').classList.contains('hidden')) return;
  const k = ev.key.toLowerCase();
  if ((k === 'p' || ev.key === 'Escape') && !ev.repeat) { togglePause(); return; }
  const i = KEYS.indexOf(k);
  if (i >= 0 && !ev.repeat) press(i);
});
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  press(Math.max(0, Math.min(3, Math.floor((ev.clientX - r.left) / r.width * 4))));
});
cv.addEventListener('touchstart', ev => ev.preventDefault(), { passive: false });
document.addEventListener('gesturestart', ev => ev.preventDefault());

function drawNote(x, y, color, alpha) {
  const r = RAD * 0.82;
  g.save();
  g.globalAlpha = alpha * 0.30;
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r * 1.38, 0, Math.PI * 2); g.fill();

  g.globalAlpha = alpha;
  const grad = g.createRadialGradient(x - r * 0.28, y - r * 0.28, r * 0.08, x, y, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.28, color);
  grad.addColorStop(0.88, '#141422');
  grad.addColorStop(1, '#090910');
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();

  g.strokeStyle = 'rgba(255,255,255,0.72)';
  g.lineWidth = 1.6;
  g.beginPath(); g.arc(x, y, r - 1, 0, Math.PI * 2); g.stroke();

  g.fillStyle = 'rgba(255,255,255,0.58)';
  g.beginPath();
  g.ellipse(x - r * 0.28, y - r * 0.32, r * 0.24, r * 0.12, -0.6, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function drawBackground() {
  g.fillStyle = '#090a14';
  g.fillRect(0, 0, W, H);

  if (bgLoaded) {
    const scale = Math.max(W / bgImg.width, H / bgImg.height);
    const dw = bgImg.width * scale, dh = bgImg.height * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    g.save();
    g.globalAlpha = 0.56;
    g.drawImage(bgImg, dx, dy, dw, dh);
    g.restore();
  }

  // Vinheta vertical para garantir contraste máximo das notas e do HUD
  const scrim = g.createLinearGradient(0, 0, 0, H);
  scrim.addColorStop(0, 'rgba(8, 9, 18, 0.72)');
  scrim.addColorStop(0.45, 'rgba(10, 12, 24, 0.36)');
  scrim.addColorStop(1, 'rgba(8, 9, 18, 0.80)');
  g.fillStyle = scrim;
  g.fillRect(0, 0, W, H);

  // Trastes sutis do braço
  const fretGap = 76;
  for (let y = fretGap; y < HIT_Y - 24; y += fretGap) {
    g.fillStyle = 'rgba(0,0,0,0.42)';
    g.fillRect(0, y + 1, W, 1.5);
    g.fillStyle = 'rgba(190,200,240,0.06)';
    g.fillRect(0, y, W, 1);
  }
}

function drawGuitarString(idx, x, vib, ts) {
  const gauge = [3.2, 2.7, 2.2][idx];
  const trace = offset => {
    g.beginPath();
    if (vib > 0.01) {
      const steps = 22, amp = vib * 2.4;
      for (let s = 0; s <= steps; s++) {
        const y = (s / steps) * H;
        const env = Math.sin((s / steps) * Math.PI);
        const dx = Math.sin(y * 0.08 + ts * 0.06 + idx) * amp * env;
        if (s === 0) g.moveTo(x + offset + dx, y);
        else g.lineTo(x + offset + dx, y);
      }
    } else {
      g.moveTo(x + offset, 0);
      g.lineTo(x + offset, H);
    }
  };

  g.save();
  g.lineCap = 'butt';
  g.strokeStyle = 'rgba(0,0,0,0.72)';
  g.lineWidth = gauge + 3;
  trace(1.2); g.stroke();

  if (vib > 0.05) {
    g.strokeStyle = `rgba(230, 210, 165, ${vib * 0.28})`;
    g.lineWidth = gauge + 5;
    trace(0); g.stroke();
  }

  g.strokeStyle = idx === 0 ? '#7d6e5d' : idx === 1 ? '#877c6f' : '#8d929c';
  g.lineWidth = gauge;
  trace(0); g.stroke();

  g.setLineDash([1.5, 2.5]);
  g.strokeStyle = 'rgba(20, 18, 16, 0.55)';
  g.lineWidth = gauge * 0.95;
  trace(0); g.stroke();

  g.lineDashOffset = 1.5;
  g.strokeStyle = 'rgba(235, 228, 215, 0.32)';
  g.lineWidth = gauge * 0.7;
  trace(-0.3); g.stroke();
  g.setLineDash([]);

  g.strokeStyle = 'rgba(255, 255, 255, 0.44)';
  g.lineWidth = 0.75;
  trace(-gauge * 0.24); g.stroke();
  g.restore();
}

function drawRoundedBox(x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r);
  else g.rect(x, y, w, h);
}

function drawHUD() {
  const mult = Math.min(4, 1 + Math.floor(combo / 10));
  const acc = hits + misses > 0 ? Math.round((hits / (hits + misses)) * 100) : 100;
  const multStyles = {
    1: { bg1: '#353a54', bg2: '#25293d', txt: '#e4e8f8', border: 'rgba(255,255,255,0.14)' },
    2: { bg1: '#ffe270', bg2: '#e6b830', txt: '#171408', border: 'rgba(230,200,74,0.55)' },
    3: { bg1: '#ff9d66', bg2: '#e05a5a', txt: '#1a0a08', border: 'rgba(255,123,84,0.65)' },
    4: { bg1: '#d99bff', bg2: '#8a4fff', txt: '#160824', border: 'rgba(199,125,255,0.75)' }
  }[mult];

  // Cartão esquerdo: Pontos + Precisão
  const lx = 10, ly = 12, lw = Math.min(168, W * 0.46), lh = 46;
  g.save();
  g.fillStyle = 'rgba(10, 12, 24, 0.78)';
  drawRoundedBox(lx, ly, lw, lh, 12);
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.14)';
  g.lineWidth = 1;
  g.stroke();

  g.fillStyle = '#9aa3c8';
  g.font = '700 10px system-ui, -apple-system, sans-serif';
  g.textAlign = 'left';
  g.fillText('PONTOS', lx + 11, ly + 15);

  g.fillStyle = acc >= 90 ? '#4caf7a' : acc >= 70 ? '#e6c84a' : '#e05a5a';
  g.textAlign = 'right';
  g.fillText(acc + '%', lx + lw - 11, ly + 15);

  g.fillStyle = '#ffffff';
  g.font = '900 19px system-ui, -apple-system, sans-serif';
  g.textAlign = 'left';
  g.fillText(score.toLocaleString('pt-BR'), lx + 11, ly + 37);

  // Cartão direito: Combo + Multiplicador
  const rw = Math.min(144, W * 0.40), rx = W - rw - 10, ry = 12, rh = 46;
  g.fillStyle = 'rgba(10, 12, 24, 0.78)';
  drawRoundedBox(rx, ry, rw, rh, 12);
  g.fill();
  g.strokeStyle = multStyles.border;
  g.lineWidth = mult > 1 ? 1.4 : 1;
  g.stroke();

  const pillW = 36, pillH = 28, px = rx + rw - pillW - 9, py = ry + (rh - pillH) / 2;
  const pGrad = g.createLinearGradient(px, py, px + pillW, py + pillH);
  pGrad.addColorStop(0, multStyles.bg1);
  pGrad.addColorStop(1, multStyles.bg2);
  g.fillStyle = pGrad;
  drawRoundedBox(px, py, pillW, pillH, 8);
  g.fill();

  g.fillStyle = multStyles.txt;
  g.font = '900 13px system-ui, -apple-system, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('x' + mult, px + pillW / 2, py + pillH / 2 + 0.5);
  g.textBaseline = 'alphabetic';

  g.fillStyle = '#aeb6d6';
  g.font = '700 10px system-ui, -apple-system, sans-serif';
  g.textAlign = 'right';
  g.fillText('COMBO', px - 8, ry + 15);

  g.fillStyle = '#ffffff';
  g.font = '900 19px system-ui, -apple-system, sans-serif';
  g.fillText(String(combo), px - 8, ry + 37);
  g.restore();
}

function draw(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastFrame) / 1000));
  lastFrame = ts;

  if (!$('gameScreen').classList.contains('hidden')) {
    const cfg = DIFFS[diffKey];
    drawBackground();

    // Linha horizontal de acerto
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fillRect(0, HIT_Y + 1, W, 3);
    const hitLineGrad = g.createLinearGradient(0, 0, W, 0);
    hitLineGrad.addColorStop(0, 'rgba(255,255,255,0.06)');
    hitLineGrad.addColorStop(0.5, 'rgba(255,255,255,0.28)');
    hitLineGrad.addColorStop(1, 'rgba(255,255,255,0.06)');
    g.strokeStyle = hitLineGrad;
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, HIT_Y); g.lineTo(W, HIT_Y); g.stroke();
    g.restore();

    // Flashes
    for (let i = 0; i < 4; i++) {
      if (flash[i] > 0) {
        const fg = g.createLinearGradient(0, HIT_Y - 190, 0, H);
        fg.addColorStop(0, 'rgba(0,0,0,0)');
        fg.addColorStop(0.75, COLORS[i]);
        fg.addColorStop(1, 'rgba(0,0,0,0)');
        g.globalAlpha = flash[i] * 0.28;
        g.fillStyle = fg;
        g.fillRect(i * LW, 0, LW, H);
        g.globalAlpha = 1;
        flash[i] = Math.max(0, flash[i] - dt * 5);
      }
    }

    // Cordas de guitarra
    for (let i = 0; i < 3; i++) {
      if (stringVib[i] > 0) stringVib[i] = Math.max(0, stringVib[i] - dt * 3.4);
      drawGuitarString(i, (i + 1) * LW, stringVib[i], ts);
    }

    // Receptores
    for (let i = 0; i < 4; i++) {
      const cx = i * LW + LW / 2;
      const pop = receptorPop[i];
      if (pop > 0) receptorPop[i] = Math.max(0, pop - dt * 6);
      const rr = RAD * (1 + pop * 0.16);

      g.globalAlpha = 0.18 + pop * 0.30;
      g.fillStyle = COLORS[i];
      g.beginPath(); g.arc(cx, HIT_Y, rr * 1.32, 0, Math.PI * 2); g.fill();

      g.globalAlpha = 1;
      g.fillStyle = 'rgba(10,12,21,0.90)';
      g.beginPath(); g.arc(cx, HIT_Y, rr, 0, Math.PI * 2); g.fill();
      g.strokeStyle = COLORS[i];
      g.lineWidth = 3.5 + pop * 2;
      g.beginPath(); g.arc(cx, HIT_Y, rr, 0, Math.PI * 2); g.stroke();

      g.strokeStyle = 'rgba(255,255,255,0.22)';
      g.lineWidth = 1;
      g.beginPath(); g.arc(cx, HIT_Y, rr * 0.74, 0, Math.PI * 2); g.stroke();

      g.fillStyle = 'rgba(255,255,255,0.45)';
      g.font = 'bold 12px system-ui, -apple-system, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(KEYS[i].toUpperCase(), cx, HIT_Y);
    }
    g.textBaseline = 'alphabetic';

    // Notas caindo e barra de progresso
    if (playing) {
      const now = ctx.currentTime - startAt - latencyMs / 1000;
      if (buffer && buffer.duration > 0) {
        const prog = Math.max(0, Math.min(1, now / buffer.duration));
        g.fillStyle = 'rgba(255,255,255,0.10)';
        g.fillRect(0, 0, W, 4);
        const pGrad = g.createLinearGradient(0, 0, W * prog, 0);
        pGrad.addColorStop(0, '#4caf7a');
        pGrad.addColorStop(1, '#7ee8b2');
        g.fillStyle = pGrad;
        g.fillRect(0, 0, W * prog, 4);
      }
      for (const o of notes) {
        if (o.t > now + cfg.fall) break;
        if (o.hit) continue;
        if (!o.missed && now - o.t > cfg.window) { o.missed = true; combo = 0; misses++; }
        const y = HIT_Y - (o.t - now) / cfg.fall * HIT_Y;
        if (y > H + RAD) continue;
        drawNote(o.lane * LW + LW / 2, y, COLORS[o.lane], o.missed ? 0.25 : 1);
      }
    }

    // Ondas de choque
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= dt * 3.2;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      const rad = r.r + (r.maxR - r.r) * (1 - r.life);
      g.globalAlpha = r.life * 0.85;
      g.strokeStyle = r.color;
      g.lineWidth = 3.5 * r.life + 1;
      g.beginPath(); g.arc(r.x, r.y, rad, 0, Math.PI * 2); g.stroke();
    }

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt * 2.2;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= 0.96;
      g.globalAlpha = p.life;
      g.fillStyle = p.color;
      g.beginPath(); g.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); g.fill();
    }

    // Popups de acerto
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.life -= dt * 1.8;
      if (p.life <= 0) { popups.splice(i, 1); continue; }
      p.y -= 36 * dt;
      g.globalAlpha = Math.min(1, p.life * 1.6);
      g.font = 'bold 14px system-ui, -apple-system, sans-serif';
      g.textAlign = 'center';
      g.fillStyle = '#000';
      g.fillText(p.text, p.x + 1, p.y + 1);
      g.fillStyle = p.color;
      g.fillText(p.text, p.x, p.y);
    }

    // Banners de marco de combo
    for (let i = comboBanners.length - 1; i >= 0; i--) {
      const b = comboBanners[i];
      b.life -= dt / b.duration;
      if (b.life <= 0) { comboBanners.splice(i, 1); continue; }
      const elapsed = 1 - b.life;
      const scale = elapsed < 0.14 ? 0.65 + (elapsed / 0.14) * 0.43 : elapsed < 0.25 ? 1.08 - ((elapsed - 0.14) / 0.11) * 0.08 : 1;
      const alpha = b.life < 0.25 ? b.life / 0.25 : Math.min(1, elapsed / 0.08);
      const by = H * 0.28 - elapsed * 18;

      g.save();
      g.translate(W / 2, by);
      g.scale(scale, scale);
      g.globalAlpha = alpha;

      const glow = g.createRadialGradient(0, 0, 8, 0, 0, 110);
      glow.addColorStop(0, b.glow); glow.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = glow;
      g.beginPath(); g.arc(0, 0, 110, 0, Math.PI * 2); g.fill();

      const bw = Math.min(W - 36, 224), bh = 58;
      g.fillStyle = 'rgba(12, 13, 24, 0.88)';
      drawRoundedBox(-bw / 2, -bh / 2, bw, bh, 14);
      g.fill();
      g.strokeStyle = b.color;
      g.lineWidth = 2;
      g.stroke();

      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = b.color;
      g.font = '900 22px system-ui, -apple-system, sans-serif';
      g.fillText(b.title, 0, -9);

      g.fillStyle = '#e8eaf6';
      g.font = '700 12px system-ui, -apple-system, sans-serif';
      g.fillText(`♪ ${b.sub} ♪`, 0, 14);
      g.restore();
    }
    g.globalAlpha = 1;

    drawHUD();

    if (paused) {
      g.fillStyle = 'rgba(8,9,18,0.72)';
      g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff';
      g.font = '900 28px system-ui, -apple-system, sans-serif';
      g.textAlign = 'center';
      g.fillText('PAUSADO', W / 2, H / 2 - 6);
      g.fillStyle = '#b4b4cc';
      g.font = '14px system-ui, -apple-system, sans-serif';
      g.fillText('Toque em Continuar para voltar', W / 2, H / 2 + 22);
    }
  }

  requestAnimationFrame(draw);
}

loadLibrary();
requestAnimationFrame(draw);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
