<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo MP3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ritmo MP3</title>
<style>
  html,body{height:100%}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#1d1d2e 0%,#0f0f17 70%);color:#eee;font-family:system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:8px;box-sizing:border-box;
    height:100dvh;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  #bar{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:480px}
  .btn{font-size:15px;font-weight:600;padding:11px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,#4caf7a,#389564);color:#fff;cursor:pointer;text-align:center;flex:1;
    box-shadow:0 2px 10px rgba(76,175,122,0.28);transition:transform .08s,opacity .15s}
  .btn:active:not(:disabled){transform:scale(0.97)}
  .btn.alt{background:#2a2a3d;box-shadow:0 2px 8px rgba(0,0,0,0.25);border:1px solid #3a3a52}
  .btn:disabled{background:#262633;color:#666;box-shadow:none;cursor:default}
  #diff{display:flex;gap:4px;width:100%;max-width:480px;background:#1a1a26;padding:4px;border-radius:10px;border:1px solid #2b2b3d;box-sizing:border-box}
  .dbtn{flex:1;border:0;border-radius:7px;padding:7px 8px;font-size:13px;font-weight:600;background:transparent;color:#9a9ab0;cursor:pointer;transition:background .15s,color .15s}
  .dbtn.active{background:#34344d;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.3)}
  #file{display:none}
  #status{margin:0;color:#a8a8be;font-size:13px;text-align:center;min-height:18px;max-width:480px}
  canvas{background:#141420;border-radius:12px;border:1px solid #29293b;box-shadow:0 8px 28px rgba(0,0,0,0.45);
    width:100%;max-width:480px;flex:1;min-height:0;touch-action:none;display:block}
</style>
</head>
<body>
<div id="bar">
  <label class="btn alt" for="file">Escolher música</label>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg">
  <button class="btn" id="play" disabled>Jogar</button>
</div>
<div id="diff" role="group" aria-label="Dificuldade">
  <button class="dbtn" data-diff="easy">Fácil</button>
  <button class="dbtn" data-diff="medium">Médio</button>
  <button class="dbtn active" data-diff="hard">Difícil</button>
</div>
<p id="status">Escolha uma música. Toque nas pistas quando as notas chegarem à linha.</p>
<canvas id="c"></canvas>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
let W = 400, H = 560, LW = 100, HIT_Y = 470, RAD = 22;
const DIFFS = {
  easy:   { label: 'Fácil',   fall: 2.1, window: 0.24, mult: 2.25, bias: 0.020, minGap: 0.55 },
  medium: { label: 'Médio',   fall: 1.8, window: 0.21, mult: 1.85, bias: 0.015, minGap: 0.36 },
  hard:   { label: 'Difícil', fall: 1.5, window: 0.18, mult: 1.50, bias: 0.010, minGap: 0.20 }
};
let diffKey = 'hard';
const COLORS = ['#4caf7a', '#e05a5a', '#e6c84a', '#4a90e2'], KEYS = ['d', 'f', 'j', 'k'];
let ctx, buffer, source, notes = [], startAt = 0, playing = false, wake = null;
let score = 0, combo = 0, hits = 0, lastFrame = performance.now();
const flash = [0, 0, 0, 0], receptorPop = [0, 0, 0, 0];
const particles = [], rings = [], popups = [];

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width || !r.height) return;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = r.width; H = r.height; LW = W / 4; HIT_Y = H - 90; RAD = Math.min(34, LW * 0.36);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// Gera as notas: detecta saltos de energia no áudio e distribui pelas pistas conforme o "brilho" do som
function makeNotes(buf, key = diffKey) {
  const cfg = DIFFS[key];
  const d = buf.getChannelData(0), sr = buf.sampleRate, hop = 1024, n = Math.floor(d.length / hop);
  const e = new Float32Array(n), z = new Float32Array(n), f = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0, c = 0;
    for (let j = i * hop, end = j + hop; j < end; j++) {
      s += d[j] * d[j];
      if (j > 0 && (d[j] >= 0) !== (d[j - 1] >= 0)) c++;
    }
    e[i] = Math.sqrt(s / hop); z[i] = c;
    if (i) f[i] = Math.max(0, e[i] - e[i - 1]);
  }
  const out = [], R = 20;
  let last = -1;
  for (let i = 1; i < n - 1; i++) {
    let m = 0, k = 0;
    for (let j = Math.max(0, i - R); j < Math.min(n, i + R); j++) { m += f[j]; k++; }
    const t = i * hop / sr;
    if (f[i] > cfg.mult * m / k + cfg.bias && f[i] >= f[i - 1] && f[i] >= f[i + 1] && t - last > cfg.minGap) {
      out.push({ t, z: z[i], hit: false, missed: false });
      last = t;
    }
  }
  const sorted = out.map(o => o.z).sort((a, b) => a - b);
  const q = p => sorted[Math.floor(sorted.length * p)] ?? 0;
  const q1 = q(0.25), q2 = q(0.5), q3 = q(0.75);
  out.forEach(o => o.lane = o.z < q1 ? 0 : o.z < q2 ? 1 : o.z < q3 ? 2 : 3);
  return out;
}

function decode(ab) {
  // Forma com callbacks: funciona também em versões antigas do Safari
  return new Promise((ok, fail) => {
    const p = ctx.decodeAudioData(ab, ok, fail);
    if (p && p.catch) p.catch(fail);
  });
}

function ensureCtx() {
  // No iPhone, faz o som sair mesmo com a chave lateral no silencioso (iOS 17+)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
}

document.querySelectorAll('.dbtn').forEach(btn => {
  btn.onclick = () => {
    const next = btn.dataset.diff;
    if (next === diffKey) return;
    diffKey = next;
    document.querySelectorAll('.dbtn').forEach(b => b.classList.toggle('active', b === btn));
    if (buffer) {
      stop();
      notes = makeNotes(buffer, diffKey);
      $('status').textContent = `${DIFFS[diffKey].label}: ${notes.length} notas geradas. Toque em Jogar.`;
    }
  };
});

$('file').onchange = async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  stop();
  $('play').disabled = true;
  $('status').textContent = 'Analisando a música...';
  try {
    ensureCtx();
    buffer = await decode(await file.arrayBuffer());
    notes = makeNotes(buffer, diffKey);
    $('status').textContent = `${DIFFS[diffKey].label}: ${notes.length} notas geradas. Toque em Jogar.`;
    $('play').disabled = false;
  } catch (err) {
    $('status').textContent = 'Não consegui ler esse arquivo. Tente outro MP3.';
  }
};

function stop() {
  if (source) { source.onended = null; try { source.stop(); } catch (e) {} source = null; }
  playing = false;
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
}

$('play').onclick = () => {
  if (!buffer) return;
  stop();
  ensureCtx();
  // resume() precisa ser chamado dentro do toque para o iOS liberar o áudio
  const ready = ctx.state === 'running' ? Promise.resolve() : ctx.resume();
  Promise.resolve(ready).catch(() => {}).then(() => {
    const cfg = DIFFS[diffKey];
    notes.forEach(o => { o.hit = o.missed = false; });
    score = combo = hits = 0;
    particles.length = rings.length = popups.length = 0;
    source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    startAt = ctx.currentTime + cfg.fall;
    source.start(startAt);
    source.onended = () => {
      playing = false;
      if (wake) { try { wake.release(); } catch (e) {} wake = null; }
      $('status').textContent = 'Fim! Pontos: ' + score + ' · Acertos: ' + hits + '/' + notes.length;
    };
    playing = true;
    $('status').textContent = `Tocando (${cfg.label})...`;
    // Mantém a tela ligada durante a música
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
  });
};

function spawnHitEffect(lane, label, pts) {
  const x = lane * LW + LW / 2, y = HIT_Y, color = COLORS[lane];
  receptorPop[lane] = 1;
  rings.push({ x, y, r: RAD * 0.9, maxR: RAD * 2.4, color, life: 1 });
  rings.push({ x, y, r: RAD * 0.5, maxR: RAD * 1.7, color: '#ffffff', life: 0.85 });
  for (let i = 0; i < 14; i++) {
    const ang = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.35;
    const spd = 90 + Math.random() * 170;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 45,
      size: 2.5 + Math.random() * 3.5,
      color: i % 4 === 0 ? '#ffffff' : color,
      life: 1
    });
  }
  popups.push({ x, y: y - RAD - 10, text: `${label} +${pts}`, color, life: 1 });
}

function press(lane) {
  flash[lane] = 1;
  if (!playing) return;
  const win = DIFFS[diffKey].window;
  const now = ctx.currentTime - startAt;
  let best = null;
  for (const o of notes) {
    if (o.t > now + win) break;
    if (o.lane === lane && !o.hit && !o.missed && Math.abs(o.t - now) <= win &&
        (!best || Math.abs(o.t - now) < Math.abs(best.t - now))) best = o;
  }
  if (best) {
    best.hit = true;
    combo++;
    hits++;
    const mult = Math.min(4, 1 + Math.floor(combo / 10));
    const pts = 10 * mult;
    score += pts;
    const err = Math.abs(best.t - now);
    const label = err <= win * 0.35 ? 'PERFEITO!' : err <= win * 0.7 ? 'ÓTIMO!' : 'BOM!';
    spawnHitEffect(lane, label, pts);
    if (navigator.vibrate) navigator.vibrate(10);
  } else {
    combo = 0;
  }
}

addEventListener('keydown', ev => {
  const i = KEYS.indexOf(ev.key.toLowerCase());
  if (i >= 0 && !ev.repeat) press(i);
});
// Cada dedo gera seu próprio pointerdown, então vários toques ao mesmo tempo funcionam
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  press(Math.max(0, Math.min(3, Math.floor((ev.clientX - r.left) / r.width * 4))));
});
cv.addEventListener('touchstart', ev => ev.preventDefault(), { passive: false });
document.addEventListener('gesturestart', ev => ev.preventDefault());

function drawNote(x, y, color, alpha) {
  const r = RAD * 0.82;
  g.save();
  g.globalAlpha = alpha * 0.25;
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r * 1.32, 0, Math.PI * 2); g.fill();

  g.globalAlpha = alpha;
  const grad = g.createRadialGradient(x - r * 0.28, y - r * 0.28, r * 0.1, x, y, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.32, color);
  grad.addColorStop(1, '#10101a');
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();

  g.strokeStyle = 'rgba(255,255,255,0.6)';
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(x, y, r - 1, 0, Math.PI * 2); g.stroke();
  g.restore();
}

function draw(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastFrame) / 1000));
  lastFrame = ts;
  const cfg = DIFFS[diffKey];

  // Fundo com gradiente sutil
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#12121d');
  bg.addColorStop(1, '#1a1a2a');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  // Linha horizontal de acerto
  g.strokeStyle = 'rgba(255,255,255,0.12)';
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, HIT_Y); g.lineTo(W, HIT_Y); g.stroke();

  // Pistas e receptores
  for (let i = 0; i < 4; i++) {
    const cx = i * LW + LW / 2;
    if (flash[i] > 0) {
      const fg = g.createLinearGradient(0, HIT_Y - 180, 0, H);
      fg.addColorStop(0, 'rgba(0,0,0,0)');
      fg.addColorStop(0.75, COLORS[i]);
      fg.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = flash[i] * 0.28;
      g.fillStyle = fg;
      g.fillRect(i * LW, 0, LW, H);
      g.globalAlpha = 1;
      flash[i] = Math.max(0, flash[i] - dt * 5);
    }
    if (i > 0) {
      g.strokeStyle = 'rgba(255,255,255,0.06)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(i * LW, 0); g.lineTo(i * LW, H); g.stroke();
    }

    const pop = receptorPop[i];
    if (pop > 0) receptorPop[i] = Math.max(0, pop - dt * 6);
    const rr = RAD * (1 + pop * 0.16);

    g.globalAlpha = 0.14 + pop * 0.28;
    g.fillStyle = COLORS[i];
    g.beginPath(); g.arc(cx, HIT_Y, rr * 1.28, 0, Math.PI * 2); g.fill();

    g.globalAlpha = 1;
    g.fillStyle = 'rgba(16,16,26,0.85)';
    g.beginPath(); g.arc(cx, HIT_Y, rr, 0, Math.PI * 2); g.fill();
    g.strokeStyle = COLORS[i];
    g.lineWidth = 3.5 + pop * 2;
    g.beginPath(); g.arc(cx, HIT_Y, rr, 0, Math.PI * 2); g.stroke();

    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.font = 'bold 12px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(KEYS[i].toUpperCase(), cx, HIT_Y);
  }
  g.textBaseline = 'alphabetic';

  // Notas caindo e barra de progresso
  if (playing) {
    const now = ctx.currentTime - startAt;
    if (buffer && buffer.duration > 0) {
      const prog = Math.max(0, Math.min(1, now / buffer.duration));
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.fillRect(0, 0, W, 4);
      g.fillStyle = '#4caf7a';
      g.fillRect(0, 0, W * prog, 4);
    }
    for (const o of notes) {
      if (o.t > now + cfg.fall) break;
      if (o.hit) continue;
      if (!o.missed && now - o.t > cfg.window) { o.missed = true; combo = 0; }
      const y = HIT_Y - (o.t - now) / cfg.fall * HIT_Y;
      if (y > H + RAD) continue;
      drawNote(o.lane * LW + LW / 2, y, COLORS[o.lane], o.missed ? 0.25 : 1);
    }
  }

  // Ondas de choque ao acertar
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt * 3.2;
    if (r.life <= 0) { rings.splice(i, 1); continue; }
    const t = 1 - r.life;
    const rad = r.r + (r.maxR - r.r) * t;
    g.globalAlpha = r.life * 0.85;
    g.strokeStyle = r.color;
    g.lineWidth = 3.5 * r.life + 1;
    g.beginPath(); g.arc(r.x, r.y, rad, 0, Math.PI * 2); g.stroke();
  }

  // Partículas de acerto
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * 2.2;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 260 * dt;
    p.vx *= 0.96;
    g.globalAlpha = p.life;
    g.fillStyle = p.color;
    g.beginPath(); g.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); g.fill();
  }

  // Texto flutuante de feedback
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt * 1.8;
    if (p.life <= 0) { popups.splice(i, 1); continue; }
    p.y -= 36 * dt;
    g.globalAlpha = Math.min(1, p.life * 1.6);
    g.font = 'bold 14px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center';
    g.fillStyle = '#000';
    g.fillText(p.text, p.x + 1, p.y + 1);
    g.fillStyle = p.color;
    g.fillText(p.text, p.x, p.y);
  }
  g.globalAlpha = 1;

  // HUD
  const mult = Math.min(4, 1 + Math.floor(combo / 10));
  g.fillStyle = '#eee';
  g.font = 'bold 16px system-ui, -apple-system, sans-serif';
  g.textAlign = 'left';
  g.fillText('Pontos: ' + score, 12, 26);
  g.textAlign = 'right';
  g.fillStyle = mult > 1 ? '#e6c84a' : '#eee';
  g.fillText(`Combo: ${combo} (x${mult})`, W - 12, 26);

  requestAnimationFrame(draw);
}
resize();
requestAnimationFrame(draw);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
